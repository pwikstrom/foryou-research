name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Use the committed annotation contract; never look for a runtime one.
      FYP_BAKED_CONTRACTS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 = production truth (Cloud Run image); see docs/python-versions.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Point storage at a scratch directory
        # The committed config/config.toml carries the maintainer's local paths;
        # this overlay (see config/config.local.toml.example) redirects all
        # storage to the runner's temp dir and disables GCS.
        run: |
          cat > config/config.local.toml <<EOF
          [paths]
          local_data = "${RUNNER_TEMP}/fyp_local"
          local_media = "${RUNNER_TEMP}/fyp_local/media"
          [data_io]
          use_gcs_for_data = false
          use_gcs_for_media = false
          use_gcs_for_cache = false
          [misc]
          local_mode = true
          EOF

      - name: Ruff (pyflakes bar)
        # Same bar as pre-commit and scripts/verify.sh; the full pyproject rule
        # set still has pre-existing debt and runs manually.
        run: ruff check --select=F --ignore=F841,F601,F403 .

      - name: Unit tests (checkout-only subset)
        run: python -m pytest -m "not requires_data and not requires_gcs and not slow and not stale"

      - name: Import-cycle / schema-hash guard
        run: python -m pytest tests/unit/test_import_cycle_hash.py

      - name: Golden annotation safety net
        run: python tests/golden/run_safety_net.py

      - name: App import smoke
        run: python -c "import web_interface.fyp_data_hub; print('app import OK')"

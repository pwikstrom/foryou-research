repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # Guard against committing another multi-MB notebook/data blob.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        # Narrow gate: block only real bugs (pyflakes + syntax).
        # Style rules (E, SIM, RUF, etc.) still run via `ruff check .` manually
        # but are not enforced at commit time while pre-existing debt is worked down.
        # Same bar as scripts/verify.sh and CI.
        args: ["--fix", "--select=F", "--ignore=F841,F403,F601"]

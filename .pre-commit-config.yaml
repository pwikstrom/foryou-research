repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # Guard against committing another multi-MB notebook/data blob.
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3  # keep in step with requirements-dev.txt
    hooks:
      - id: ruff
        # Enforced rule set comes from pyproject.toml [tool.ruff.lint] — the
        # same bar as scripts/verify.sh and CI. (The hook passes
        # --force-exclude, so pyproject's extend-exclude is honored.)
        args: ["--fix"]
      - id: ruff-format

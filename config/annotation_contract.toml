# Declarative annotation contract — the single source for the Gemini prompt,
# the structured-output response_schema, and the flattener (Workstream E).
#
# Edit this file to experiment with the annotation variable set. From it the
# pipeline generates, by pure deterministic templating (no LLM):
#   * the text prompt           (annotation_schema.build_prompt)
#   * the response_schema       (annotation_schema.build_response_schema)
#   * the flattener field specs (annotation_schema.FIELD_SPECS / flatten_structured)
#
# The prompt is [prompt].header, then one bullet per field (document order),
# then [prompt].footer. A field's schema-affecting attributes (type / enum /
# array / keys) feed the response_schema; its `desc` feeds BOTH the schema node
# description and the prompt bullet. Everything feeds the annotation_version
# hash, so any change is versioned and promote-gated.
#
# Per-field options (everything except `name` is optional):
#   name     — output key (also the column prefix for object fields)
#   desc     — one-line instruction; feeds the prompt bullet and schema description
#   enum     — name of an enum in [enums]; auto-rendered into the prompt
#   array    — true (uncapped) or an integer N (maxItems = N) → the field is a list
#   type     — "string" (default) | "int" | "object"
#   min/max  — integer bounds (type = "int")
#   keys     — [fields.keys] sub-table for type = "object" (see faces/audio below)
#   scale    — recode kind. Inferred from the shape (array → list, int → numeric,
#              enum → categorical); REQUIRED only for a free-text string field,
#              where "categorical" (short labels) vs "text" (long prose) picks
#              the recode function. Metadata-only (never version-affecting).
#   role     — var_schema role: "feature" (correlations feature) or "skip"
#              (drop from recoded output). Metadata-only.
#   display_name — web-UI label for the recoded column. Metadata-only.
#
# Inferred (never written): the flatten rule (scalar / list_join / object_unpack),
# the full JSON-schema node, enum rendering, `required` (= every field), and
# `scale` wherever the shape determines it. Web-UI column descriptions reuse
# `desc` (the retired per-field `description` key is still parsed for legacy
# files). Legacy contracts with [[section]] prompt grouping still render
# byte-identically; new contracts are sectionless.
#
# Recode normalization is derived from this contract, not from var_schema columns
# (the old `mapper` / `ignore_strings` columns were retired). A field with an
# `enum` is a closed value set: structured output already constrains it, so it is
# not folded through GENERIC_MAPPER (canonical values, incl. Multiple / -, stay
# intact). Every other field is folded through GENERIC_MAPPER to tidy free-text
# junk. The only field-specific stop words are the few in [recode.drop] below,
# keyed by the flattened output column name.

[prompt]
header = "You are a rigorous social-media video analyst. Input: a single video file. Analyze the video and return exactly one consolidated JSON object containing all of the fields described below. Do not include any extra commentary—only valid JSON. When the video does not give you enough evidence to determine a field with reasonable confidence, use its uncertainty value rather than guessing — '-' (or 'Unclear', where the field offers it) for single-value and free-text fields, and an empty list for list fields. Only commit to a definite value when the evidence clearly supports it."
footer = "**Return** the final JSON object with all of the above fields exactly as keys."

# ---------------------------------------------------------------------------
# Recode hints. Field-specific stop words dropped (on top of the global
# IRRELEVANT_WORDS list) when an open-vocabulary field is recoded. Keyed by the
# flattened output column name so object sub-keys (e.g. notable_sounds) work too.
# ---------------------------------------------------------------------------
[recode.drop]
objects = ["woman", "man", "person", "people"]
symbols_and_brands = ["tiktok", "tiktok logo", "instagram", "instagram logo", "youtube", "youtube logo"]
notable_sounds = ["speech", "music"]

# ---------------------------------------------------------------------------
# Enums. A bare list has no per-value descriptions; a table maps value ->
# description (key order is the canonical order, preserved by tomllib).
# ---------------------------------------------------------------------------
[enums]
yes_no = ["Yes", "No", "Unclear"]
gender = ["Female", "Male", "Nonbinary", "Multiple", "-"]
ethnicity = ["Indigenous Australian", "Caucasian", "Middle Eastern", "South Asian", "Northeast Asian", "Southeast Asian", "African", "Native American", "Multiple", "-"]
type_of_story = ["Issue-Based", "Event-Based", "Human-Interest", "Descriptive"]

[enums.content_category]
"Performance" = "Videos showcasing musical or movement-based performance, including live singing, dancing, or lip-syncing."
"Comedy" = "Content intended to entertain through humor, including skits, stand-up comedy, parodies, or satirical commentary. Use only when humour is the primary driver; treat it as a fallback when the video does not fit another category."
"Film & TV" = "Videos that reference, recap, parody, or comment on television programs or films. Use only when the film or TV show is central to the video, not merely referenced or used as source material."
"Anime & Comics" = "Content that engages with or is rooted in anime or comic book culture, including narratives, discussions, cosplay, fan art, or parodies. Use only when the anime or comic narrative is central; anime-style aesthetics or filters alone do not qualify."
"Games" = "Videos related to gaming, including gameplay, reviews, walkthroughs, or gaming memes."
"Drama" = "Videos featuring emotionally charged narratives or serious storytelling."
"Art & Creativity" = "Videos showcasing artistic endeavors such as drawing, painting, or other creative projects outside of performance."
"Sports" = "Videos involving athletic performance, sports highlights, or sports commentary."
"Daily Life" = "Videos capturing everyday routines, personal vlogs, or behind-the-scenes moments. Do not use for scripted or unscripted performances or sketches."
"Fashion & Beauty" = "Content focused on self-presentation, including makeup tutorials, skincare routines, clothing hauls, and styling tips."
"Interpersonal Relationships" = "Videos exploring human connections—romantic, platonic, toxic, dangerous - both positive and negative."
"Food" = "Videos centered on food — recipes, reviews, dieting, nutrition, or cooking — including specific produce, groceries, and snacks (lollies, ice cream); covers positive and negative food narratives."
"Animals" = "Content featuring pets, wildlife, or humorous and heartwarming animal moments."
"Fitness & Physical Health" = "Videos related to physical exercise, wellness tips, or health challenges."
"DIY & Life Hacks" = "Videos offering practical advice, step-by-step instructions, or innovative solutions for everyday problems."
"Travel" = "Content documenting travel experiences, scenic destinations, or offering travel tips and itineraries."
"Mental Health & Wellbeing" = "Videos addressing mental health topics, self-care practices, or mindfulness techniques."
"News" = "Content that informs or comments on current and specific events, political developments, or trending topics. Use for specific current events, not broader issues (use Society)."
"Education" = "Videos aimed at teaching or instructing viewers through tutorials, how-to guides, or academic content."
"Technology & Design & Reviews" = "Content focusing on technological innovations, product design, and detailed reviews, including automotive content (electric vehicles, smart-car features, car reviews, and design-driven unboxings)."
"Finance" = "Videos addressing financial topics such as budgeting, investments, money management, or economic trends."
"Society" = "Videos engaging with broader social or cultural issues, phenomena, or activism. Use for broad societal topics, not specific current events (use News) and not relationship issues (use Interpersonal Relationships)."

# ---------------------------------------------------------------------------
# Fields (the Gemini output fields, in prompt/schema order).
# ---------------------------------------------------------------------------

[[fields]]
name = "transcript"
scale = "text"
display_name = "Transcript"
desc = "A verbatim transcript of the words spoken or sung in the video."

[[fields]]
name = "spoken_language"
scale = "categorical"
display_name = "Spoken language"
desc = "The primary language spoken or sung in the video — if several are used, give the one used most. Provide an English name (e.g. 'English', 'Mandarin', 'Arabic'). Use '-' if there is no spoken or sung language (music-only or silent)."

[[fields]]
name = "multilingual"
role = "feature"
display_name = "Multilingual"
enum = "yes_no"
desc = "Are multiple languages spoken or sung in the video (e.g. code-switching, or different speakers using different languages)? Answer No if there is no speech or only one language is used."

[[fields]]
name = "objects"
display_name = "Objects in video"
array = true
desc = "Notable objects visible in the video."

[[fields]]
name = "symbols_and_brands"
display_name = "Symbols and brands"
array = true
desc = "Visible symbols, flags, or brands."

[[fields]]
name = "text_overlays"
display_name = "Text overlays"
array = true
desc = "On-screen text, transcribed via OCR."

[[fields]]
name = "faces"
type = "object"
array = true
desc = "Each distinct face that appears in the video, with its gender, apparent age in years, and apparent ethnicity."
[fields.keys]
gender = { spec = "enum:gender", role = "skip", display_name = "Gender of observed faces" }
age_estimate = { spec = "int: the apparent age of the face, in years (a single best estimate)", display_name = "Average age of observed faces" }
ethnicity = { spec = "the apparent ethnicity", role = "skip", display_name = "Ethnicity of observed faces" }

[[fields]]
name = "audio_summary"
type = "object"
desc = "The video's audio profile: how much of the audio is speech (as a percentage of speech vs music/other), the style/mood of any background music, and any notable sounds or sound effects."
[fields.keys]
speech_vs_music = { spec = "int(0,100): the percentage of the audio that is spoken word (0 = all music/other, 100 = all speech)", display_name = "Speech % (vs music)" }
# A free-text sub-key of a single object: its scale cannot be inferred, and it
# must be "text" (Gemini returns one prose sentence — the list cleaner would
# mangle it).
background_music = { spec = "the style or mood of any background music", scale = "text", display_name = "Background music" }
notable_sounds = { spec = "list: notable sounds or sound effects", display_name = "Notable sounds" }

[[fields]]
name = "main_activity"
role = "feature"
scale = "categorical"
display_name = "Main activity"
desc = "The main activity, as a verb + object, e.g. 'dancing in a studio'."

[[fields]]
name = "video_story"
scale = "text"
display_name = "Video story"
desc = "A concise narrative summary of the entire video."

[[fields]]
name = "type_of_story"
role = "feature"
display_name = "Type of story"
enum = "type_of_story"
desc = "The narrative type of the video."

[[fields]]
name = "content_category"
role = "feature"
display_name = "Content category"
enum = "content_category"
array = 2
desc = "The content categories that best capture the video's dominant focus (up to two; list the most central first). Weigh whether the video's primary purpose is entertainment & cultural expression, lifestyle & personal content, or informative & advisory content, then choose the most fitting category."

[[fields]]
name = "primary_country"
scale = "categorical"
display_name = "Primary country"
desc = "The country the video is primarily connected to — through the creator's origin (accent, language, location tags, or profile), the content's subject matter (events, places, landmarks, or social issues), or its intended audience (region-specific hashtags or localised references). Give the single most-connected country as an English name (e.g. 'Australia', 'United States', 'India'). Use '-' when there is no clear country connection (generic or globally-oriented content)."

[[fields]]
name = "tiktok_native"
role = "feature"
display_name = "Platform Native"
enum = "yes_no"
desc = "Is the video produced primarily for the short-video platform it appears on — vertical/portrait, short (typically under 60 seconds), using the platform's native features (filters, effects, text overlays, trending sounds) and pacing? Answer No for content clearly made for another platform or medium (e.g. a longer TV-style video) and merely reposted."

[[fields]]
name = "trend_technical"
role = "feature"
display_name = "Technical trend"
enum = "yes_no"
desc = "Does the video leverage a technical short-video trend — a trending template, effect, or sound used to make it (e.g. a CapCut 'try this effect' or 'use this sound' template)? A video can be both a technical and a cultural trend."

[[fields]]
name = "trend_cultural"
role = "feature"
display_name = "Cultural trend"
enum = "yes_no"
desc = "Does the video replicate a cultural short-video trend — a participatory format meant for other creators to imitate (e.g. a dance challenge, meme, or format like 'candy salad')? A video can be both a technical and a cultural trend."

[[fields]]
name = "advertising"
role = "feature"
display_name = "Advertising - Gemini"
enum = "yes_no"
desc = "Is the video an explicit paid promotion of a product, service, or brand — shown by a sponsorship label, repeated prominent brand mentions, or a direct call to purchase or visit? Answer No for an organic review or discussion, or a creator simply expressing affinity for a brand with no sign of a commercial agreement."

[[fields]]
name = "aigc"
display_name = "AIGC"
enum = "yes_no"
desc = "Is the video primarily AI-generated — AI-generated elements forming a substantial part of it (e.g. prompt-generated footage), or explicitly labelled AI-generated by the creator or platform? Answer No when only minor AI elements are present (e.g. AI stickers, memes, or background music)."

[[fields]]
name = "main_gender"
role = "feature"
display_name = "Main gender"
enum = "gender"
desc = "The gender of the main person featured in the video."

[[fields]]
name = "main_ethnicity"
role = "feature"
display_name = "Main ethnicity"
enum = "ethnicity"
desc = "The ethnicity of the main person featured in the video."

[[fields]]
name = "political_score"
role = "feature"
display_name = "Political? (score 0-1)"
type = "int"
min = 0
max = 100
desc = "How political the video is, from 0 (not at all) to 100 (entirely political)."

[[fields]]
name = "sensitivity_score"
role = "feature"
display_name = "Sensitive? (score 0-1)"
type = "int"
min = 0
max = 100
desc = "How sensitive the video's subject matter is, from 0 (not at all) to 100 (extremely sensitive)."

[[fields]]
name = "call_to_action"
scale = "text"
display_name = "Call to action"
desc = "The action the video encourages the viewer to take, or '-' if none."

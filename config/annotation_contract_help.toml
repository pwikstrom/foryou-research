# Help texts for the annotation-contract form editor.
#
# This file is the UI-servable transcription of the explanatory comments in
# config/annotation_contract.toml — the editor renders these as per-panel help
# and per-input tooltips (fyp.annotation_contract.contract_help). Keep it in
# lockstep with that file's comments: it is the authoritative documentation of
# how the contract works once a contract is form-edited (tomlkit preserves
# comments on untouched tables, but a regenerated table loses them).
#
# Keys are dotted paths: a bare table name ("fields") documents the editor
# panel; "fields.<key>" documents one input.

[help]
overview = """The contract is the single source for the Gemini prompt, the structured-output response_schema, and the flattener. From it the pipeline generates, by pure deterministic templating (no LLM): the text prompt (annotation_schema.build_prompt), the response_schema (annotation_schema.build_response_schema), and the flattener field specs (flatten_structured). The prompt is the header, then one bullet per field, then the footer. A field's schema-affecting attributes (answer type / enum / list / sub-keys) feed the response_schema; its prompt instruction feeds BOTH the schema node description and the prompt bullet. Everything feeds the annotation_version hash, so any prompt/schema change is versioned and promote-gated; metadata-only edits (display names, roles, scale, recode drop-words) don't mint a new annotation version."""

prompt = "The fixed text around the generated field bullets. 'header' opens the prompt (analyst instructions, uncertainty conventions); 'footer' closes it."
"prompt.header" = "Required. Opens the prompt: the analyst role, the one-JSON-object instruction, and the uncertainty convention ('-' / 'Unclear' / empty list rather than guessing)."
"prompt.footer" = "Optional. Closes the prompt (e.g. 'Return the final JSON object with all of the above fields exactly as keys.')."

"recode.drop" = "Field-specific stop words dropped (on top of the global irrelevant-words stoplist) when an open-vocabulary field is recoded. Keyed by the flattened output column name, so object sub-keys (e.g. notable_sounds) work too. Metadata-only: never mints a new annotation version."

enums = "Named closed value sets referenced by fields. A bare list has no per-value descriptions; a value → description table documents each value (key order is the canonical order). An enum field is a closed value set: structured output already constrains it, so recode does not fold it through the generic mapper — canonical values (incl. 'Multiple' / '-') stay intact. Every non-enum field is folded through the generic mapper to tidy free-text junk."

fields = "The Gemini output fields, in prompt/schema order. Everything except 'name' is optional. The flatten rule, the full JSON-schema node, enum rendering, 'required' (= every field), and the recode scale (except for free-text fields) are inferred — never written."
"fields.name" = "Required. The JSON output key; also the column prefix for object fields (sub-keys flatten to '<name>_<key>')."
"fields.desc" = "One-line instruction to Gemini; feeds BOTH the prompt bullet and the schema node description, and doubles as the column's web-UI description. Changing it changes the annotation version."
"fields.answer" = "What Gemini returns for this field: free text, a category from a closed value set (pick the enum), a bounded number, or an object with sub-fields. Combined with 'how many', this fully determines the response schema. Changing it changes the annotation version."
"fields.enum" = "Name of an enum in [enums]; constrains the field (or each list item) to that closed value set, auto-rendered into the prompt."
"fields.array" = "Whether the field is a single value or a list — uncapped, or capped at N items. Lists pipe-join at flatten time. Changing it changes the annotation version."
"fields.min" = "Lower bound for a number field. With max, lets the generic numeric recode rescale the value to 0-1."
"fields.max" = "Upper bound for a number field."
"fields.keys" = """Sub-keys for an object field. Each value is either a compact spec string — 'enum:NAME' (closed set), 'list: <desc>' (array of strings), 'int(lo,hi): <desc>' or 'int: <desc>' (integer, optional bounds), or plain text (a string sub-key whose description is the text) — or an inline table { spec = "...", role = "...", scale = "...", display_name = "..." } that also carries var_schema metadata. Sub-keys flatten to '<field>_<key>' columns."""
"fields.role" = "How the recoded column is used: '(default)' = a plain variable, 'feature' = offered in Correlations, 'skip' = dropped from the recoded output. Metadata-only: doesn't change the annotation version."
"fields.scale" = "How the column is recoded ('categorical' / 'list' / 'numeric' / 'text'). Inferred from the field's shape; only a free-text field must choose — 'categorical' for short labels (cleaned like a value list), 'text' for long prose (kept as-is). Metadata-only."
"fields.display_name" = "Human-readable name shown across the web UI. Metadata-only."

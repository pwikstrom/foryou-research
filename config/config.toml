##########################################################################################
# Machine annotation
##########################################################################################
# One [machine.<backend>] block per annotation backend, each with the same
# anatomy: its own connection/generation keys, an optional
# `pricing = {input = ..., output = ...}` inline table (USD per 1M tokens,
# used only to display approximate cost on Annotation-testing runs — no API
# exposes prices, so update manually; thinking tokens bill as output), and an
# optional [machine.<backend>.variants.<name>] subtable per pinned model
# version. The active backend/variant is selected at runtime in Admin →
# General; the values here are config-only (edit + restart/redeploy).
#
# Variants: a variant's override keys are its parent block's keys; `label`
# and `pricing` are metadata. Variant names are lowercase [a-z0-9_], globally
# unique, and must not reuse a backend id. Each variant forks its own av_
# annotation version automatically. Batch-mode annotation runs only on the
# plain gemini selection; a local backend holds one resident model per worker
# process (restart to switch local variants).

[machine]
# Backend-agnostic annotation settings.
# Items longer than this (seconds) are never queued for annotation.
max_duration_for_annotation = 300
# Per-item token estimates for the pre-queue cost display (USD estimate =
# items x tokens x the backend's `pricing`). Calibrate against the token
# counts in recent Annotation-testing (ab_eval) run reports.
est_input_tokens_per_annotation = 15000
est_output_tokens_per_annotation = 1500


# ── Gemini (default backend; Vertex AI or API-key mode) ─────────────────────
# Credentials: either set vertexai = true with a GCP project (Application
# Default Credentials), or vertexai = false with a GEMINI_API_KEY environment
# variable (loaded into `key` at config init; leave the committed value
# blank). Deployed services fall back to FYP_VERTEX_PROJECT / GCP_PROJECT_ID
# env vars when `project` is empty. Machine-local values belong in
# config/config.local.toml, not here.
[machine.gemini]
key = ""
model = "gemini-3-flash-preview"
vertexai = true
project = ""
location = "global"
http_options_api_version = "v1"
http_options_timeout = 180000

# Generation parameters (output-affecting → part of the av_ version identity).
# Temperature 0.0 for reproducibility: an n=80 A/B (docs/annotation-ab-findings.md)
# showed schema-constrained structured output does NOT loop at temp=0, content
# is unchanged, and reproducibility improves markedly (enum 0.887→0.928).
temperature = 0.0
max_output_tokens = 65536
thinking_budget = -1

# Video frame resolution sent to Gemini. Empty = API default = HIGH for video.
# An n=80 HIGH-vs-LOW A/B (docs/annotation-ab-findings.md) found LOW saves ~41%
# input tokens but degrades symbols_and_brands + sensitivity_score, so HIGH
# is kept. LOW==MEDIUM for Gemini-3 video (~70 vs ~280 tokens/frame).
media_resolution = ""

# Transient-failure retry policy (429/5xx/deadline/timeout only; fails fast
# on everything else). max_retries counts retries AFTER the first attempt.
max_retries = 2
retry_base_delay = 2.0

pricing = {input = 0.50, output = 3.00}

[machine.gemini.variants.gemini_31]
model = "gemini-3.1-flash-lite"
pricing = {input = 0.25, output = 1.50}

[machine.gemini.variants.gemini_35]
model = "gemini-3.5-flash-lite"
pricing = {input = 0.30, output = 2.50}

[machine.gemini.variants.gemini_36]
model = "gemini-3.6-flash"
pricing = {input = 1.50, output = 7.50}


# ── Hosted Qwen (Alibaba Model Studio / DashScope, intl region) ─────────────
# Requires the DASHSCOPE_API_KEY environment variable. Sends the whole video
# (base64) to the omni model — audio track included. Throughput is bound by
# account-level rate limits (2026-07: 60 RPM / 100k tokens per minute ≈ 5
# short videos/minute), not by max_workers, so keep the pool small; 429s are
# retried with backoff. Pricing caveat: the omni models bill audio/video
# input above the text rate, so the figure is a lower bound.
# See docs/installation.md#enabling-hosted-qwen-annotation.
[machine.qwen_api]
model_id = "qwen3.5-omni-flash"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
temperature = 0.0
max_tokens = 8000
max_workers = 4
max_attempts = 5
request_timeout = 600
max_video_mb = 90
pricing = {input = 0.10, output = 0.80}


# ── Local Qwen3-Omni 30B (Apple Silicon + MLX only) ─────────────────────────
# Values are pilot-tuned (2026-07): 8 frames @448px + the audio track matched
# 16 frames @560px in quality at half the cost (~30 s/video, 23 GB peak on an
# M2 Max). Frame/audio sampling parameters are output-affecting and therefore
# part of the annotation version identity. No pricing — runs locally for free.
# Install: pip install -e ".[local_qwen]" — see
# docs/installation.md#enabling-local-qwen-annotation.
[machine.qwen_local]
model_id = "mlx-community/Qwen3-Omni-30B-A3B-Instruct-4bit"
max_frames = 8
frame_scale = 448
fps = 1.0
max_tokens = 4096
repetition_penalty = 1.08
with_audio = true


# ── Local MiniCPM-o 9B (Apple Silicon + MLX only) ───────────────────────────
# The lighter local alternative for 16–32 GB Macs: ~24 s/video and 8 GB peak
# in the 2026-07 pilot, agreement vs Gemini slightly below the 30B Qwen
# model. Same frames+audio recipe; sampling parameters are part of the
# annotation version identity. No pricing — runs locally for free.
# Install: pip install -e ".[local_minicpm]" — see
# docs/installation.md#enabling-local-minicpm-annotation.
[machine.minicpm_local]
model_id = "mlx-community/MiniCPM-o-4_5-4bit"
max_frames = 8
frame_scale = 448
fps = 1.0
max_tokens = 4096
repetition_penalty = 1.08
with_audio = true



##########################################################################################
# embedding
##########################################################################################
# Embedding backends for the semantic space pipeline (select via Admin →
# General → Embeddings). The embedding store is scoped per model, so changing
# a backend's model_id (or switching backends) re-embeds under the new model —
# old vectors are kept and remain valid for the old model id.

# Default Gemini embedding backend (Vertex AI or API-key mode).
# gemini-embedding-001 supports Matryoshka truncation to 768/1536/3072 dims;
# 1536 is the quality/size sweet spot. location pins the Vertex embedding
# endpoint (ignored in API-key mode); task_type tunes vectors for clustering.
# Switching to gemini-embedding-2 (multimodal, no task_type parameter) is a
# config edit: set model_id = "gemini-embedding-2" and task_type = "" (empty
# omits the parameter). The model-scoped store re-embeds the corpus under the
# new model on the next refresh; old vectors are kept.
[embedding.gemini]
model_id = "gemini-embedding-001"
dim = 1536
location = "us-central1"
task_type = "CLUSTERING"

# Hosted Qwen text embeddings (Alibaba Model Studio / DashScope, intl region;
# requires the DASHSCOPE_API_KEY environment variable — same key as the
# qwen_api annotation backend). text-embedding-v4 is Qwen3-Embedding-based and
# supports a dimensions parameter (64–2048); the API caps 10 inputs/request,
# hence the small batch_size.
[embedding.qwen_api]
model_id = "text-embedding-v4"
dim = 1024
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
batch_size = 10
request_timeout = 60

# Local Qwen text-embedding backend. Runs on MPS / CUDA / CPU via
# sentence-transformers; the 0.6B model is ~1.2 GB. dim is the Matryoshka
# truncation (0.6B supports 32–1024).
# Install: pip install -e ".[local_embeddings]" — see
# docs/installation.md#enabling-local-embeddings.
[embedding.qwen_local]
model_id = "Qwen/Qwen3-Embedding-0.6B"
dim = 1024
batch_size = 64



##########################################################################################
# paths
##########################################################################################
[paths]

# Path for all project data except for media files (temp and backup dirs end up
# here as well). A leading ~ expands to the current user's home directory;
# override with an absolute path in config/config.local.toml if needed.
local_data = "~/fyp_local"

# Path for locally-stored media. Used only when data_io.use_gcs_for_media = false.
# May live outside local_data — keep it on a disk with enough room for videos.
local_media = "~/fyp_local/media"



##########################################################################################
# sessions — viewing-session identification + Sessions-tab analysis parameters
##########################################################################################
[sessions]

# Inter-activity gap (seconds) that closes a viewing session ("sitting") at
# ingest. Applied when session_ids are assigned during an ingest refresh —
# changing it only affects rows (re)ingested afterwards, and the Sessions
# artifacts must be rebuilt to match.
session_gap_s = 900

# Binge (focus-episode) segmentation, applied by the sessions_refresh worker.
# A binge grows while the next distinct embedded video's mean cosine distance
# to the centroid of the last binge_mem members stays <= binge_cut; it is kept
# if it spans >= binge_min_videos distinct videos over >= binge_min_minutes.
# Changing any of these needs a sessions_refresh — they are baked in at build.
binge_cut = 0.5
binge_mem = 6
binge_min_videos = 4

# Consecutive off-theme videos a binge survives. An ad in the middle of a
# binge is the motivating case: the viewer returns to the theme immediately,
# so the binge did not end. Tolerated videos are NOT members — they never
# enter the centroid, never extend the span, and are counted as n_skipped.
#
# 0 restores the pre-2026-08-10 behaviour, where one off-theme video both
# ended the run AND seeded the next one. That seeding was the damaging part:
# the theme had to re-accumulate from an anchor that was not the theme, and
# 99.4% of candidate runs on the production corpus ended under
# binge_min_videos. Raising this merges more, but a binge that tolerates many
# interruptions is a weaker claim — read n_skipped on the card alongside it.
binge_max_skip = 2

# Off-theme plays the viewer merely flicked past (dwell under this many
# seconds) do NOT count toward binge_max_skip. A video dismissed in a second
# or two is feed noise the viewer rejected, not a departure from the theme —
# only off-theme videos actually watched spend the skip budget. Flicked
# videos are still never members and still count in n_skipped, so the card
# stays honest about how much the binge tolerated. 0 restores the pure-count
# rule. Validated 2026-08-11 on session AIO-00060: the count-only rule cut a
# 4-video exercise cluster off its adjacent 14-video binge over 3 off-theme
# videos totalling 3 s of dwell.
binge_flick_seconds = 3.0

# Minimum span of a kept binge. Was 3.0 until 2026-08-10, which dropped 65%
# of the runs that reached binge_min_videos: it penalised fast scrolling,
# which is if anything the more binge-like behaviour (a 6-video run in 79
# seconds is not a weak binge). binge_min_videos carries the substance.
binge_min_minutes = 1.0

# Low-entropy sequences: sliding windows of window_n consecutive distinct
# embedded videos; up to max_windows non-overlapping windows with the smallest
# mean pairwise distance are kept per session.
window_n = 6
max_windows = 3

# How many plays immediately before/after a selected binge or low-entropy
# sequence the Sessions-tab player offers as (clearly marked) context.
context_plays = 3

# A binge is called "directed" (a rabbit hole that travels, rather than one
# that circles a topic) when its straightness beats this share of REORDERINGS
# OF ITS OWN MEMBERS — the permutation p-value stored as direction_p. Read at
# query time, so changing it re-labels immediately without a rebuild.
# Raw straightness cannot be thresholded directly: it falls like 1/sqrt(steps)
# under any random walk (measured: -0.92 rank correlation with binge length),
# so the pre-2026-08 fixed 0.5 cut was a length test that never once fired.
# Reversing an order leaves straightness unchanged, so the smallest reachable
# p is 2/k! — binges under 5 videos cannot be tested at all and report null.
drift_p = 0.05

# Within-binge trend scan: the smallest number of members carrying a variable
# before that variable is tested for a monotone trend across the binge.
# Below 7 the exact permutation test cannot survive multiplicity correction
# across the ~9 scanned variables, so a lower value would only manufacture
# findings. Sequences are always window_n videos long and are never scanned.
trend_min_videos = 7

# Session-list floors: a session is listed on the Sessions tab only if it has
# at least this many plays, lasts at least this many minutes, and has at least
# this share of its distinct videos embedded. Applied at QUERY time, not at
# build time — the artifacts stay complete, so a change takes effect on the
# next page load with no rebuild, and the tab always reports how many sessions
# the floors removed.
#
# These are the SEED values only. Admin → Site Settings → "Sessions tab list
# floors" overrides them at runtime and, once saved there, wins over this file
# (per key). Edit here to change what a fresh deployment starts with; edit
# there to retune a running instance.
#
# The committed values are a deliberate research choice, not a safety floor:
# they sit above the point where the detectors can still find something, so
# they DO hide a few real findings. Measured on the 79,150-session corpus, 10
# plays + 3 minutes lists 64.4% of sessions and hides 1,008 of the 32,645 that
# carry a binge or a low-entropy sequence (3.09%) — 7 of them binges. The
# 3-minute floor accounts for most of that loss (849 sessions; the shortest
# sequence runs 13 s). Drop to 4 / 0.0 / 0 for the structurally safe setting,
# which hides nothing findable but keeps the 1-play, 0-minute fragments.
#
# min_session_coverage_pct starts at 0 (off). It is the bluntest of the three:
# coverage is an artifact of how much of the corpus has been scraped and
# embedded, not of the donor's behaviour, so a coverage floor hides sessions
# for a reason that says nothing about the session itself. Raise it when you
# want the list to only offer sessions whose entropy scores rest on most of
# their content.
min_session_plays = 10
min_session_minutes = 3.0
min_session_coverage_pct = 0



##########################################################################################
# misc
##########################################################################################
[misc]

# this label is added to zeeschuimer ndjson files in the zeeschuimer_raw folder
TIME_ZONE = "Australia/Brisbane"
local_mode = false
# Host used for the fast HEAD connectivity probe before touching GCS/Gemini.
# connectivity_probe_host = "connectivitycheck.gstatic.com"
max_duration_for_download = 300
min_media_object_size = 8_000
# Supplement Instagram scrapes with play/like/comment counts from Instagram's
# authenticated media-info endpoint (fyp.instagram_dl._fetch_media_info_counts).
# It is the private authenticated web API; set false to disable instantly if the
# research account is challenged. A module circuit breaker also pauses it on
# repeated rate-limit responses within a batch.
ig_fetch_view_counts = true


##########################################################################################
# Feature flags
##########################################################################################
[features]

# Admin "Variable Schema" tab + /api/manage/schema endpoints.
# Off-switch only — the routes are also gated by the
# `tab.admin.schema` permission.  Set false in an incident to disable
# without redeploying.
var_schema_admin = true

# aio_aws_fetch: auto-fetch AIO donations + participant metadata from AWS on
# every ingest refresh. When the key is ABSENT (the committed default) the
# fetch runs only on Cloud Run (K_SERVICE set) — a fresh local install never
# scans someone else's DynamoDB just because ambient ~/.aws credentials exist.
# Set true/false in config.local.toml to force either way. The manual
# "Fetch AIO" button in Data Management is unaffected.
# aio_aws_fetch = true


##########################################################################################
# site / instance branding
##########################################################################################
[site]

# Instance-operator values — committed defaults are deliberately empty so no
# third-party install shows someone else's contact details. Set them in
# config/config.local.toml, or via the FYP_CONTACT_EMAIL / FYP_MAIL_SENDER /
# FYP_APP_URL environment variables (env wins; the deployed services use env).
# contact_email: shown on the public guide/FAQ pages and the home-tab feedback
#   note (those passages are hidden while empty).
# mail_sender: Gmail address outbound mail is sent from (mail no-ops while
#   empty or while MAIL_PASSWORD is unset).
# app_url: public URL of this instance, used for "log in at ..." links in
#   outbound emails.
contact_email = ""
mail_sender = ""
app_url = ""


##########################################################################################
# web server
##########################################################################################
[web]

# Boot-time system-health check is skipped while the persisted result is
# younger than this (hours). 0 forces a run on every boot/cold start.
health_check_max_age_hours = 6


##########################################################################################
# data io
##########################################################################################
[data_io]

# The name of the GCS bucket - set by environment variable FYP_GCS_BUCKET_NAME.
GCS_bucket_name = "" 

# Local-first defaults: a fresh install stores everything on the local disk.
# Set these true (typically in config/config.local.toml) to use a GCS bucket.
# On Cloud Run (K_SERVICE) all three flags are forced true; the env var
# FYP_FORCE_GCS=1 does the same for a local process (e.g. a local scrape-queue drain).
use_gcs_for_data = false
use_gcs_for_media = false
use_gcs_for_cache = false

# path/prefix for GCS bucket
gcs_data_prefix = "data"
gcs_media_prefix = "media"



##########################################################################################
# visualisation / analysis tabs
##########################################################################################
[viz]

# When true (default) the Explore and Video Analysis tabs only show items where
# annotated_ok == True. When false they also include items that have been scraped
# but not yet annotated; annotation-derived columns will be empty for those rows.
# The Correlations tab always requires annotation regardless of this flag, because
# PCA features are themselves annotation-derived.
require_annotated_items = false


##########################################################################################
# correlations tab
##########################################################################################
[correlations]

# Minimum explained variance (%) for a PCA component to be offered in the
# Correlations UI (axis dropdowns and the heatmap). The highest-variance
# component of each variable is always kept.
min_variance_pct = 5.0

# How many PCA components each variable may contribute to the Correlations UI
# (its highest-variance ones). The cap is PER VARIABLE because a
# high-cardinality variable (e.g. ~150 niches) spreads its variance thinly
# over a dozen components that no one interprets, while a small variable's
# third component can still carry 20%+ — a single variance floor cannot serve
# both. Deliberately not a UI control: changing which correlations exist is a
# study-level analytic choice, not a per-session one.
max_components_per_variable = 3

# Scatter responses are capped at this many points (deterministic sample; the
# heatmap always uses all rows).
max_scatter_points = 5000

# Factors with at least this many distinct values are not offered as levels
# anywhere on the Correlations tab.
factor_value_limit = 500

# Correlation method for the heatmap matrix: "pearson" or "spearman".
correlation_method = "pearson"

# Groups (collection-days) smaller than this are dropped before the PCA.
minimum_group_size = 10

# Absolute correlation a category needs with a component to appear in that
# component's plain-language interpretation ("More likely: ...").
interpretation_cutoff = 0.2

# Permutations for the per-variable-family PERMANOVA in the precomputed
# "Group differences" stats (run by the pca_refresh worker).
permanova_permutations = 999

# Below this many collections, the Correlations captions carry a standing
# non-independence caveat (days within a collection are not independent, so
# pooled p-values are anti-conservative) and the scatter caption lists
# per-collection regression slopes.
independence_warning_collections = 10

# When the scatter has a colour split with at most this many series, the
# Regression toggle also draws each series' own line (fitted on the full
# data; legend show/hide toggles a series' line together with its dots).
# Above the cap, only the pooled whole-study line is drawn.
max_regression_series = 12




##########################################################################################
# Machine annotations
#########################################################################################
[machine]

# Your Gemini API Key (set via environment variable GEMINI_API_KEY; leave blank here)
key = "" 

# The model
model = "gemini-3-flash-preview"

# the prompt
prompt = "new_prompt_002.txt"

# When true, annotation uses Gemini structured output (response_schema from
# fyp/annotation_schema.py) instead of free-text JSON. Default false keeps the
# original free-text path. The output column shape is identical either way;
# structured output guarantees valid JSON and enforces the variable schema.
use_structured_output = true

# Vertex AI settings
vertexai = true
project = "<gcp-project>"
location = "global"
http_options_api_version = "v1"
http_options_timeout = 180000
# Gemini 3 strongly recommends temperature 1.0; values below 1.0 risk looping /
# degraded reasoning. Pinned here for the gemini-3-flash-preview structured path.
temperature = 1.0
max_output_tokens = 65536
response_mime_type = "application/json"
presence_penalty = 0.6
frequency_penalty = 1.2
thinking_budget = -1

# Transient-failure retry policy for the Gemini call (see machine_annotation.
# _generate_with_retry). Retries only transient errors (429 / 5xx / deadline /
# timeout / dropped connection); fails fast on everything else. max_retries is
# the number of retries AFTER the first attempt; base delay grows exponentially.
max_retries = 2
retry_base_delay = 2.0

# Video frame resolution sent to Gemini. Empty = API default (current behaviour).
# For Gemini-3 video, LOW and MEDIUM are equivalent (~70 tokens/frame) and HIGH
# is ~280 tokens/frame, so "LOW" is the cost lever (~75% fewer frame tokens).
# Flip to "LOW" only after an A/B confirms acceptable quality on OCR/face fields.
# Changing this creates a new annotation_version automatically.
media_resolution = ""

max_duration_for_annotation = 300



##########################################################################################
# paths
##########################################################################################
[paths]

# Path for all project data except for media files (temp and backup dirs end up here as well)
local_data = "/Users/<user>/fyp_local"

# Absolute path for locally-stored media. Used only when data_io.use_gcs_for_media = false.
# May live outside local_data — keep it on a disk with enough room for videos.
local_media = "/Users/<user>/Desktop/fyp_mini/media"



##########################################################################################
# misc
##########################################################################################
[misc]

# this label is added to zeeschuimer ndjson files in the zeeschuimer_raw folder
TIME_ZONE = "Australia/Brisbane"
local_mode = false
max_duration_for_download = 300
min_media_object_size = 8_000
scraper_backend = "ytdlp"


##########################################################################################
# Feature flags
##########################################################################################
[features]

# Admin "Variable Schema" tab + /api/manage/schema endpoints.
# Off-switch only — the routes are also gated by the
# `tab.admin.schema` permission.  Set false in an incident to disable
# without redeploying.
var_schema_admin = true


##########################################################################################
# data io
##########################################################################################
[data_io]

# The name of the GCS bucket - set by environment variable FYP_GCS_BUCKET_NAME.
GCS_bucket_name = "" 

use_gcs_for_data = false
use_gcs_for_media = true
use_gcs_for_cache = false

# path/prefix for GCS bucket
gcs_data_prefix = "data"
gcs_media_prefix = "media"



##########################################################################################
# visualisation / analysis tabs
##########################################################################################
[viz]

# When true (default) the Explore and Video Analysis tabs only show items where
# annotated_ok == True. When false they also include items that have been scraped
# but not yet annotated; annotation-derived columns will be empty for those rows.
# The Correlations tab always requires annotation regardless of this flag, because
# PCA features are themselves annotation-derived.
require_annotated_items = false




# Declarative derived contract — owns the var_schema metadata for columns that no
# scraper / annotator / ingest step directly emits: the enrichment columns COMPUTED
# AT MERGE TIME in fyp/organize_datasets.py:new_merge() (days_since_created /
# completion_rate / scraped_fail), the embeddings-derived niche columns (niche /
# niche_name), the recode fan-out of the scrape-owned `desc` (desc_hashtags /
# desc_raw), and the per-item enrichment status flags (scraped_ok / annotated_ok /
# annotated_fail).
#
# Metadata-only: unlike scrape/activity contracts this drives no computation — the
# calculations stay in organize_datasets / recode. It moves role / scale /
# display_name / description / section for these columns out of var_schema.csv and
# folds a field-set digest into the var_schema hash.
#
# NOTE: `plays_per_day` is NOT here — it is derived at scrape time and owned by
# the scrape contract. `scraped_fail` / `scraped_ok` / `annotated_ok` /
# `annotated_fail` are the working per-item status flags (kept as-is; not replaced
# by scrape_status). desc_hashtags/desc_raw live HERE (not the scrape contract) so
# they never leak into BaseScraper.base_columns — they are recode fan-out, not
# scraper output.

[meta]
version = "1"

[[fields]]
name = "days_since_created"
dtype = "double[pyarrow]"
section = "Activity"
role = "measure"
scale = "numeric"
transform = "log1p"
display_name = "Days since posted"
description = "Number of days elapsed between the item's post time and this activity — freshness of the served item. Log-transformed (log1p) before group averaging in the PCA/correlations frame."

[[fields]]
name = "completion_rate"
dtype = "double[pyarrow]"
section = "Activity"
role = "measure"
scale = "numeric"
display_name = "Completion Rate"
description = "How much of the item the user played at this activity (0-1)."

[[fields]]
name = "engaged"
dtype = "double[pyarrow]"
section = "Activity"
role = "measure"
scale = "numeric"
display_name = "Engaged with item"
description = "1 when this play carries any of the account's own engagement activity (fave/comment/share/save/follow folded into extra_data), else 0. Group mean = the collection's own engagement rate — distinct from the item-popularity *_per_K_play rates. Platform caveat: Instagram/YouTube exports log fewer engagement types than TikTok, so cross-platform levels are not directly comparable."

[[fields]]
name = "rewatched"
dtype = "double[pyarrow]"
section = "Activity"
role = "measure"
scale = "numeric"
display_name = "Rewatched item"
description = "1 when play_duration exceeds the item's duration (looped or rewatched), else 0. Recovers the signal completion_rate's clip at 1.0 discards."

[[fields]]
name = "is_weekend"
dtype = "string[pyarrow]"
section = "Activity"
role = "comparison"
scale = "categorical"
display_name = "Weekend"
description = "'weekend' (saturday/sunday) or 'weekday', derived from Activity weekday at merge time."

# Group-level: computed per collection-day at PCA build (fyp/analysis/pca.py),
# not per row — declared here so the contract stays the source of the metadata.
[[fields]]
name = "videos_watched"
skip_recode = true
dtype = "int64[pyarrow]"
section = "Activity"
scale = "numeric"
display_name = "Videos watched (day)"
description = "Number of annotated videos the collection played that day (each correlations group's size) — consumption intensity, in natural units."

[[fields]]
name = "scraped_fail"
dtype = "bool[pyarrow]"
section = "backstage"
role = "skip"
scale = "categorical"
display_name = "Scrape failed"
description = "Whether the item's media scrape failed (item_id in the failed-scrapes set)."

# The niche columns are model-derived labels, so they sit under the same UI
# section as the Gemini annotation fields rather than in a section of their own.
# `section` is cosmetic — compute_var_schema_hash() excludes it, so moving a
# field between sections never invalidates a cached study parquet.
[[fields]]
name = "niche_name"
dtype = "string[pyarrow]"
section = "AI Annotations"
role = "measure"
scale = "categorical"
display_name = "Niche"
description = "Embeddings-derived micro-genre (KMeans cluster of video embeddings, Gemini-named). High-cardinality: tabs surface the top niches by frequency and fold the long tail into 'Other'. Best-effort-stable across map rebuilds."

[[fields]]
name = "niche"
dtype = "int64[pyarrow]"
section = "AI Annotations"
role = "skip"
scale = "raw"
display_name = "Niche ID"
description = "Integer niche cluster id (join key to video_niches.json); hidden from tabs."

# The two embedding-geometry measures, joined from video_map.parquet alongside
# the niche label. Both are percentiles, not raw scores: the underlying cosine
# and PCA distances are in arbitrary units whose scale shifts with every map
# rebuild, so only the rank is comparable across builds. Both are null for
# videos that are not yet in the map, which costs those rows their place in the
# correlations frame (see organize_datasets._join_niche_columns).
[[fields]]
name = "typicality_pct"
dtype = "double[pyarrow]"
section = "AI Annotations"
role = "measure"
scale = "numeric"
display_name = "Typicality"
description = "How mainstream the video is — its percentile among all embedded videos for closeness to the corpus mean direction (100 = closest to the average of everything the corpus is about; low = distinctive). Measured on the embedding vectors and NOT readable off the 2D semantic map, which places a video near its neighbours but is free to put that neighbourhood anywhere on the page. Group mean = how mainstream that collection-day's feed was."

[[fields]]
name = "niche_isolation_pct"
dtype = "double[pyarrow]"
section = "AI Annotations"
role = "measure"
scale = "numeric"
display_name = "Niche isolation"
description = "How much company the video's micro-genre keeps — its niche's percentile distance to the NEAREST other niche (100 = the most isolated niche in the corpus). Measured on the same reduced vectors the clustering consumed, and empirically independent of Typicality: a niche can sit far from the corpus average yet keep close company, or be thoroughly ordinary with nothing beside it."

# Recode fan-out of the scrape-owned `desc` (produced by recode_tokenise). Owned
# here rather than the scrape contract so they never enter BaseScraper.base_columns.
[[fields]]
name = "desc_hashtags"
dtype = "list<string>[pyarrow]"
section = "Item metadata"
scale = "list"
display_name = "Description hashtags"
description = "Hashtags extracted from the caption (recode fan-out of the scrape-owned `desc`)."

[[fields]]
name = "desc_raw"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "text"
display_name = "Description"
description = "Original caption text, preserved before hashtag extraction (the `<field>_raw` copy of `desc`)."

# Per-item enrichment status flags (kept as the working flags; scrape_status is the
# scraper-layer outcome and stays separate). role=skip: hidden from analysis.
[[fields]]
name = "scraped_ok"
# Not skipped: these status flags historically went through the recode plan
# (scale=categorical → recode_stringified_list); kept for hash stability.
skip_recode = false
dtype = "bool[pyarrow]"
section = "backstage"
role = "skip"
scale = "categorical"
display_name = "Scrape OK"
description = "Whether the item's media scrape succeeded (per-item enrichment status)."

[[fields]]
name = "annotated_ok"
skip_recode = false
dtype = "bool[pyarrow]"
section = "backstage"
role = "skip"
scale = "categorical"
display_name = "Machine annotation OK"
description = "Whether the item was annotated successfully (type_of_story present)."

[[fields]]
name = "annotated_fail"
skip_recode = false
dtype = "bool[pyarrow]"
section = "backstage"
role = "skip"
scale = "categorical"
display_name = "Machine annotation failed"
description = "Whether the item's annotation failed (type_of_story missing)."

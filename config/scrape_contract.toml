# ===========================================================================
# Instagram PLATFORM-SPECIFIC fields. Instagram has no fields of its own left:
# its counts and handle map to the generic base fields in the scraper's
# _RAW_TO_CANONICAL (ig_like_count → fave_count, ig_comment_count →
# comment_count, ig_author_handle → author_handle). Instagram exposes no
# share/save counts, so those base counts (and rates) stay NA. Registering the
# platform is done in fyp/instagram_dl.py; the retired ig_* contract fields
# live on as read-only "legacy" rows via the sv_ registry snapshots.
# ===========================================================================

# ===========================================================================
# YouTube PLATFORM-SPECIFIC fields. Counts and handle map to the generic base
# fields (yt_like_count → fave_count, yt_comment_count → comment_count,
# yt_author_handle → author_handle); YouTube exposes no share/save counts.
# ===========================================================================

[[fields]]
name = "yt_channel_follower_count"
scope = "platform"
platform = "youtube"
dtype = "int64[pyarrow]"
section = "Popularity"
scale = "numeric"
display_name = "Channel subscribers"
description = "Subscriber count of the uploading channel at scrape time."

[[fields]]
name = "yt_categories"
scope = "platform"
platform = "youtube"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "text"
display_name = "Video categories"
description = "YouTube's category labels for the video, ' | '-joined."


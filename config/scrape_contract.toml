# Declarative scrape contract — the single source for the canonical, cross-platform
# scrape schema. It plays the same role for the scraper that
# `config/annotation_contract.toml` plays for the Gemini annotator.
#
# From this file:
#   * the scraper base class (`fyp/platform_scraper.py`) reads its base
#     (scope="base") and per-platform (scope="platform") field sets + PyArrow
#     dtypes — the `REQUIRED_COLUMNS` / `additional_columns` analogue from
#     `fyp/ingest.py`;
#   * `fyp/fyp_config.py` overlays role / scale / display_name / description /
#     section onto the matching `var_schema` rows (so `var_schema.csv` stops
#     owning that metadata), and injects any scrape columns missing from the CSV;
#   * `fyp/recode_variables.py` folds a digest of the field set into the
#     var_schema hash so a contract edit invalidates cached study parquets.
#
# Per-field keys (everything except `name` + `scope` + `dtype` is optional):
#   name        — canonical stored column name (the REAL schema)
#   scope       — "base" (every platform emits it) | "platform"
#   platform    — for scope="platform": which platform owns the field (e.g. "tiktok")
#   dtype       — PyArrow dtype string for the stored column, e.g. "double[pyarrow]"
#   section     — var_schema UI section (Item metadata / Popularity / backstage / ...)
#   role        — var_schema role (standard / feature / factor / skip / raw / ...)
#   scale       — var_schema scale (string / ratio / datetime / dichotomous / ...)
#   display_name / description — var_schema metadata (overlaid at load)
#   derived     — true when computed at scrape time, not a raw platform field
#   per_k_of    — for an engagement-rate field, the absolute-count denominator base
#                 field it is normalised against (count / play_count * 1000)
#
# A new platform = one new subclass + a block of scope="platform" [[fields]] here.
# The generic popularity counts (fave_count / comment_count / share_count /
# save_count) and author_handle are BASE fields: the subclass translates its
# platform-specific names to them in its _RAW_TO_CANONICAL map. No other edits
# required.

[meta]
version = "1"
default_platform = "tiktok"
# Registered platforms. Explicit (not derived from scope="platform" fields)
# because a platform whose fields all map to generic base names owns no
# platform-scoped fields at all (Instagram), yet still needs its scrape queue,
# worker process, and version-descriptor entry.
platforms = ["tiktok", "instagram", "youtube"]

# Generic-count source for each canonical *_per_K_play ratio. The base class
# derives  rate = count / play_count * 1000  using this map; platforms without a
# given count (e.g. Instagram/YouTube share/save) leave the count NA, so the
# rate stays NA too.
[perk]
faves_per_K_play = "fave_count"
comments_per_K_play = "comment_count"
shares_per_K_play = "share_count"
saves_per_K_play = "save_count"

# ===========================================================================
# BASE fields. Every platform subclass must emit these canonical names.
# ===========================================================================

[[fields]]
name = "scrape_status"
scope = "base"
dtype = "string[pyarrow]"
section = "backstage"
scale = "categorical"
display_name = "Scrape status"
description = "Outcome of the scrape: 'ok', 'permanent:<reason>', or 'transient:<reason>'. Enrichment-seed rows built from donated metadata (fyp.ingest.save_enrichment_seed) carry 'donated' — not yet scraped, eligible for scraping, and lowest-precedence in any merge with real scrapes."
derived = true

[[fields]]
name = "storage_link"
scope = "base"
dtype = "string[pyarrow]"
section = "backstage"
role = "skip"
scale = "text"
display_name = "Media storage link"
description = "Path or URL to the stored media object for this item (empty when no media was saved)."
derived = true

[[fields]]
name = "scrape_ts"
scope = "base"
dtype = "timestamp[ns][pyarrow]"
section = "backstage"
role = "skip"
scale = "datetime"
display_name = "Scrape time"
description = "Timestamp of when this item was scraped."
derived = true

[[fields]]
name = "scrape_contract_version"
scope = "base"
dtype = "string[pyarrow]"
section = "backstage"
role = "skip"
scale = "categorical"
display_name = "Scrape contract version"
description = "Deterministic sv_<hash> of the scrape-contract field set active when this row was scraped (per-row provenance)."
derived = true

# No role/scale/display_name on purpose: the activity contract owns the
# source_platform var_schema row; this entry only adds the column to the
# scrape dtype set so every scraped row is stamped with its platform.
[[fields]]
name = "source_platform"
scope = "base"
dtype = "string[pyarrow]"
section = "backstage"
description = "Platform this item was scraped from (e.g. 'tiktok'). Stamped by the scraper base class."
derived = true

[[fields]]
name = "desc"
scope = "base"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "raw"
display_name = "Desc raw"
description = "Description text."

[[fields]]
name = "create_time"
scope = "base"
dtype = "timestamp[ns][pyarrow]"
section = "Item metadata"
scale = "datetime"
display_name = "Time added to platform"
description = "Timestamp of when the item was uploaded to the platform."

[[fields]]
name = "author_id"
scope = "base"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "text"
display_name = "Author ID"
description = "Stable platform identifier for the item's creator."

[[fields]]
name = "duration"
scope = "base"
dtype = "int64[pyarrow]"
section = "Item metadata"
role = "feature"
scale = "numeric"
display_name = "Video duration"
description = "Length of the item in seconds."

[[fields]]
name = "author_name"
scope = "base"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "text"
display_name = "Author nickname"
description = "The display name shown on the creator's profile."

[[fields]]
name = "author_handle"
scope = "base"
dtype = "string[pyarrow]"
section = "Item metadata"
scale = "text"
display_name = "Author handle"
description = "The creator's unique @username handle (author_name holds the display name)."

[[fields]]
name = "play_count"
scope = "base"
dtype = "int64[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
transform = "log1p"
display_name = "Play count"
description = "Total plays/views of the item. Log-transformed (log1p) before group averaging in the PCA/correlations frame."

[[fields]]
name = "fave_count"
scope = "base"
dtype = "int64[pyarrow]"
section = "Popularity"
scale = "numeric"
display_name = "Fave count"
description = "Total likes/faves on the item (called likes on Instagram/YouTube; hidden-like items carry no value)."

[[fields]]
name = "comment_count"
scope = "base"
dtype = "int64[pyarrow]"
section = "Popularity"
scale = "numeric"
display_name = "Comment count"
description = "Total comments on the item (missing when comments are disabled or not extracted)."

[[fields]]
name = "share_count"
scope = "base"
dtype = "int64[pyarrow]"
section = "Popularity"
scale = "numeric"
display_name = "Share count"
description = "Total shares of the item (NA on platforms that expose no share count, e.g. Instagram/YouTube)."

[[fields]]
name = "save_count"
scope = "base"
dtype = "int64[pyarrow]"
section = "Popularity"
scale = "numeric"
display_name = "Save count"
description = "Number of times the item was saved/collected (NA on platforms that expose no save count, e.g. Instagram/YouTube)."

[[fields]]
name = "faves_per_K_play"
scope = "base"
dtype = "double[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
display_name = "Faves per 1K plays"
description = "Likes per thousand plays (likes / plays * 1000)."
derived = true
per_k_of = "play_count"

[[fields]]
name = "comments_per_K_play"
scope = "base"
dtype = "double[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
display_name = "Comments per 1K plays"
description = "Comments per thousand plays (comments / plays * 1000)."
derived = true
per_k_of = "play_count"

[[fields]]
name = "shares_per_K_play"
scope = "base"
dtype = "double[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
display_name = "Shares per 1K plays"
description = "Shares per thousand plays (shares / plays * 1000)."
derived = true
per_k_of = "play_count"

[[fields]]
name = "saves_per_K_play"
scope = "base"
dtype = "double[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
display_name = "Saves per 1K plays"
description = "Saves per thousand plays (saves / plays * 1000)."
derived = true
per_k_of = "play_count"

[[fields]]
name = "plays_per_day"
scope = "base"
dtype = "double[pyarrow]"
section = "Popularity"
role = "feature"
scale = "numeric"
transform = "log1p"
display_name = "Plays per day"
description = "Average plays per day since upload (play_count / days since upload), computed at scrape time — virality velocity of the served item. Log-transformed (log1p) before group averaging in the PCA/correlations frame."
derived = true


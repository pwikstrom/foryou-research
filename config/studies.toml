# ====================================================================================
# This is where you define parameters for different studies
# ====================================================================================

# MIN_DURATION = 0 # minimum watch duration in seconds, set to 0 to include all events
# MIN_NUNIQUE_USERS = 1 # minimum number of unique users per video, set to 1 to include all events

# START_DATE & END_DATE: Only keep events between these date - parameters exist for DDPs and for Baseline

# the data donations contains a rather large number of events, so we can sample them to make 
# the subsequent processing faster and cheaper
# NOTE that this is a systematic sampling of the DDP events to ensure reproducibility. It is not a random sampling.
# DDP_SAMPLING_FRACTION = 0 # set to zero to not sample anything, set to 1.0 to include all events

# sometimes we want to focus on certain donations. This allows you to do this
# It's a list of special donation IDs that are included in addition to the sampled events
# SPECIAL_DONATIONS = []

# Is Zeeschuimer data be included in the study
# if this is set to True ONLY zeeschuimer data will be included in the log export since log export 
# can only contain either DDP events or Zeeschuimer data, not both.
# the export of unique video stats though, can contain both DDP events and Zeeschuimer data
# INCLUDE_ZEESCHUIMER_DATA = True

# some variables from the data enrichment is only found for a very small number of logged events
# these are note useful int he exports and might as well be dropped. This parameter controls the threshold for dropping these columns
# if the fraction of missing data in a column is above this threshold, the column is dropped
# COL_MISSING_DATA_THRES = 0.5

# timestamps in the data donation logs are reported in local timezones without information about 
# which timezone it is. This parameter sets the assumed timezone for these.
# TODO: If we go international, this needs to be adjusted so that it can handle multiple timezones.
# TIME_ZONE = "Australia/Brisbane"


[baseline_only]
MIN_DURATION = 0 # minimum watch duration in seconds, set to 0 to include all events
MIN_NUNIQUE_USERS = 1 # minimum number of unique users per video, set to 1 to include all events
DDP_START_DATE = "2024-05-15" # only keep events after this date
DDP_END_DATE = "2024-07-15" # only keep events before this date
BASELINE_START_DATE = "2024-05-15" # only keep events after this date
BASELINE_END_DATE = "2024-07-15" # only keep events before this date
DDP_SAMPLING_FRACTION = 0.0 # set to zero to not sample anything, set to 1.0 to include all events
DDP_STRATIFICATION_VARIABLE = "" # parameter for stratified random sampling with disproportionate allocation
DDP_STRATUM_SIZE = -1 # parameter for stratified random sampling with disproportionate allocation
SPECIAL_DONATIONS = []
INCLUDE_ZEESCHUIMER_DATA = true
COL_MISSING_DATA_THRES = 0.5
TIME_ZONE = "Australia/Brisbane"


[everything]
MIN_DURATION = 0 # minimum watch duration in seconds, set to 0 to include all events
MIN_NUNIQUE_USERS = 1 # minimum number of unique users per video, set to 1 to include all events
DDP_START_DATE = "2023-01-01" # only keep events after this date
DDP_END_DATE = "2025-12-31" # only keep events before this date
BASELINE_START_DATE = "2024-05-15" # only keep events after this date
BASELINE_END_DATE = "2024-07-15" # only keep events before this date
SPECIAL_DONATIONS = []
INCLUDE_ZEESCHUIMER_DATA = true
COL_MISSING_DATA_THRES = 0.5
TIME_ZONE = "Australia/Brisbane"
DONATION_DATE_GROUP_VARIABLES = ["D_donation_id","T_local_date"]

# I want donations where there are a considerable number of dates within this range.
MIN_TIKTOK_DATES_WITHIN_LIMITS_PER_DONATION = 20

# percentile limits for the number of events in donation-dates groups, based on the median of all donation groups
# the reasoning here is that I want 'average' TikTok dates. I want to avoid dates
# when the user has only watched very few videos or dates when they have watched thousands. 
DONATION_DATE_GROUP_PERCENTILE_LIMITS = [0.25,0.75]

# how many dates to pick from each donation
N_SAMPLED_DATES_FROM_EACH_DONATION = 30

# how many events to pick from each donation-date group
N_SAMPLED_EVENTS_FROM_EACH_DONATION_DATE_GROUP = 35



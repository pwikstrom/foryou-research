[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-pipeline"
version = "0.1.0"
description = "FYP social-media research data pipeline (ingestion, scraping, LLM annotation, analysis)"
requires-python = ">=3.12"
# Loose floor pins for the packages fyp/ actually imports. requirements312.txt
# remains the production lock (used by Dockerfile.base) — keep it authoritative
# for exact versions. yt-dlp plugin packages (yt-dlp-ejs,
# bgutil-ytdlp-pot-provider) are loaded implicitly by yt-dlp, never imported,
# and live only in requirements312.txt. scikit-bio is imported by fyp/stats.py
# but missing from requirements312.txt (known gap — see Phase 4 notes).
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "emoji>=2.15",
    "fuzzy-json>=0.1",
    "gcsfs>=2025.12",
    "google-api-core>=2.19",
    "google-cloud-storage>=3.1",
    "google-genai>=1.56",
    "moviepy>=2.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "polars>=1.40",
    "psutil>=6.0",
    "pyarrow>=22.0",
    "rapidfuzz>=3.14",
    "requests>=2.32",
    "scikit-bio>=0.7",
    "scikit-learn>=1.8",
    "scipy>=1.16",
    "statsmodels>=0.14",
    "toml>=0.10",
    "tomlkit>=0.15",
    "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
# Mirrors requirements-dev.txt, which stays authoritative for pinned dev installs.
dev = [
    "pytest>=8.2",
    "ruff>=0.15",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
# Only the fyp library is packaged; web_interface stays app code.
include = ["fyp*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = [
    "tests/scratchpads",
    "tests/debug",
    "tests/_archive",
    "sandbox",
    "tmp",
    ".fypenv",
    ".fypenv314",
]
markers = [
    "requires_data: needs local/production data files (parquets, media) not present in a fresh checkout",
    "requires_gcs: needs live Google Cloud Storage / GCP credentials",
    "slow: takes noticeably long to run; excluded from the quick gate",
    "stale: known-broken against current contracts/data shapes; needs updating, not a regression",
]
addopts = "-q"

# Strict typing ratchet: only new Phase 8 files are checked; extend the list
# as modules gain full annotations. (mypy is not part of the verify.sh gate.)
[tool.mypy]
files = ["fyp/core/paths.py", "fyp/core/__init__.py"]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "_archive",
    "sandbox",
    "tmp",
    "patrik_secrets",
    ".fypenv",
    ".fypenv314",
    "fyp/mypyktok.py",
    "tests/scratchpads",
    "tests/debug",
    "tests/_archive",
    "scripts/adhoc",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter if adopted)
    "B008",   # function call in default arg (common in Flask)
    "SIM108", # ternary-vs-if (often less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841", "E402"]
"web_interface/run_*.py" = ["E402"]  # path-setup before imports is intentional
"fyp/*/__init__.py" = ["F401"]  # subpackage __init__s re-export the old module surface

[tool.ruff.lint.isort]
known-first-party = ["fyp", "web_interface"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-pipeline"
version = "0.4.0"
description = "For You Data Hub short-video research data pipeline (ingestion, scraping, LLM annotation, analysis)"
requires-python = ">=3.12"
# Loose floor pins for the packages fyp/ actually imports. requirements.txt
# remains the production lock (used by Dockerfile.base) — keep it authoritative
# for exact versions. yt-dlp plugin packages (yt-dlp-ejs,
# bgutil-ytdlp-pot-provider) are loaded implicitly by yt-dlp, never imported,
# and live only in requirements.txt.
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "emoji>=2.15",
    "fuzzy-json>=0.1",
    "gcsfs>=2025.12",
    "google-api-core>=2.19",
    "google-cloud-storage>=3.1",
    "google-genai>=1.56",
    "moviepy>=2.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "polars>=1.40",
    "psutil>=6.0",
    "pyarrow>=22.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "requests>=2.32",
    "scikit-bio>=0.7",
    "scikit-learn>=1.8",
    "scipy>=1.16",
    "statsmodels>=0.14",
    "toml>=0.10",
    "tomlkit>=0.15",
    "yt-dlp>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/pwikstrom/foryou-research"
Repository = "https://github.com/pwikstrom/foryou-research"
Issues = "https://github.com/pwikstrom/foryou-research/issues"
Documentation = "https://github.com/pwikstrom/foryou-research/blob/main/README.md"

[project.optional-dependencies]
# Mirrors requirements-dev.txt, which stays authoritative for pinned dev installs.
dev = [
    "pytest>=8.2",
    "ruff==0.16.3",
    "pre-commit>=3.7",
]
# Local Qwen annotation backend (Apple Silicon + MLX only). Deliberately NOT
# in requirements.txt — that file is the production Docker lock and mlx does
# not exist on linux/amd64. The 0.6.x pin matches the workarounds in
# fyp/annotation/backends/qwen_rope_fix.py (upstream Blaizzy/mlx-vlm #1619,
# #1620); re-validate before moving the pin.
local_qwen = [
    "mlx-vlm>=0.6.4,<0.7; sys_platform == 'darwin'",
]
# Local MiniCPM annotation backend (Apple Silicon + MLX only). Same runtime
# and pin rationale as local_qwen; the 0.6.x pin also matches the checkpoint-
# naming workaround in fyp/annotation/backends/minicpm_sanitize_fix.py.
local_minicpm = [
    "mlx-vlm>=0.6.4,<0.7; sys_platform == 'darwin'",
]
# Local text-embedding backend (Qwen3-Embedding via sentence-transformers).
# Separate from local_qwen so annotation-only installs don't pull torch.
local_embeddings = [
    "sentence-transformers>=3.0",
]
# Interactive analysis of the Hub's outputs in notebooks. Nothing in the app
# imports these, so they are not in requirements.txt (the production image).
notebook = [
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "itables>=2.1",
]

[tool.setuptools.packages.find]
# Only the fyp library is packaged; web_interface stays app code.
include = ["fyp*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = [
    "tests/scratchpads",
    "tests/debug",
    "tests/_archive",
    "sandbox",
    "tmp",
    ".venv",
    ".fypenv*",
]
markers = [
    "requires_data: needs local/production data files (parquets, media) not present in a fresh checkout",
    "requires_gcs: needs live Google Cloud Storage / GCP credentials",
    "slow: takes noticeably long to run; excluded from the quick gate",
    "stale: known-broken against current contracts/data shapes; needs updating, not a regression",
]
addopts = "-q"

# Strict typing ratchet: only newly-extracted files are checked; extend the list
# as modules gain full annotations. (mypy is not part of the verify.sh gate.)
[tool.mypy]
files = ["fyp/core/paths.py", "fyp/core/__init__.py"]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "_archive",
    "sandbox",
    "tmp",
    "patrik_secrets",
    ".venv",
    ".fypenv*",
    "fyp/mypyktok.py",
    "tests/scratchpads",
    "tests/debug",
    "tests/_archive",
    "scripts/adhoc",
]

[tool.ruff.lint]
# The ENFORCED bar: CI, pre-commit and scripts/verify.sh all run plain
# `ruff check .` and `ruff format --check .` against this configuration.
select = [
    "F",       # pyflakes
    "E9",      # syntax / IO errors
    "E701",    # multiple statements on one line (colon)
    "E702",    # multiple statements on one line (semicolon)
    "E703",    # useless trailing semicolon
    "E722",    # bare except
    "I",       # isort (import ordering)
    "TID251",  # banned imports: the flat fyp/<name>.py alias shims (below)
]
ignore = [
    # Pre-existing debt, kept visible here rather than suppressed inline.
    "F841",  # unused local variable (12)
    "F601",  # repeated dict key literal (2, recode_variables True/1 aliases)
    "F403",  # star import (1, analysis/donations.py)
]
# Next ratchet (debt measured 2026-09-28; enable a family once it is clean):
# the rest of E (E712 x29, E721 x9, E741 x6, E731 x2), UP, B, SIM, C4, PIE,
# RUF (incl. RUF100 unused-noqa, which must wait until the families its noqa
# comments target are enabled).

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841", "E402"]
"fyp/*/__init__.py" = ["F401"]  # subpackage __init__s re-export the old module surface
# The shims themselves, and the tests that exercise them on purpose.
"fyp/*.py" = ["TID251"]
"tests/unit/test_subpackage_shims.py" = ["TID251"]
"tests/unit/test_timelines_import_race.py" = ["TID251"]
"tests/unit/test_import_cycle_hash.py" = ["TID251"]

# Flat alias shims (fyp/<name>.py) stay importable for code outside this repo;
# first-party code must use the canonical subpackage path. See CONTRIBUTING.md.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fyp.ab_eval".msg = "flat alias shim; import fyp.annotation.ab_eval"
"fyp.activity_analysis".msg = "flat alias shim; import fyp.analysis.activity_analysis"
"fyp.activity_contract".msg = "flat alias shim; import fyp.core.activity_contract"
"fyp.activity_versioning".msg = "flat alias shim; import fyp.core.activity_versioning"
"fyp.annotation_contract".msg = "flat alias shim; import fyp.annotation.annotation_contract"
"fyp.annotation_schema".msg = "flat alias shim; import fyp.annotation.annotation_schema"
"fyp.annotation_versioning".msg = "flat alias shim; import fyp.annotation.annotation_versioning"
"fyp.calc_collection_stats".msg = "flat alias shim; import fyp.analysis.calc_collection_stats"
"fyp.data_io".msg = "flat alias shim; import fyp.core.data_io"
"fyp.derived_contract".msg = "flat alias shim; import fyp.core.derived_contract"
"fyp.donations".msg = "flat alias shim; import fyp.ingest.donations"
"fyp.embeddings".msg = "flat alias shim; import fyp.analysis.embeddings"
"fyp.fyp_config".msg = "flat alias shim; import fyp.core.fyp_config"
"fyp.human_eval".msg = "flat alias shim; import fyp.annotation.human_eval"
"fyp.instagram_dl".msg = "flat alias shim; import fyp.scrape.instagram_dl"
"fyp.irrelevant_words".msg = "flat alias shim; import fyp.annotation.irrelevant_words"
"fyp.logging_setup".msg = "flat alias shim; import fyp.core.logging_setup"
"fyp.machine_annotation".msg = "flat alias shim; import fyp.annotation.machine_annotation"
"fyp.machine_annotation_batch".msg = "flat alias shim; import fyp.annotation.machine_annotation_batch"
"fyp.media_paths".msg = "flat alias shim; import fyp.core.media_paths"
"fyp.niche_detection".msg = "flat alias shim; import fyp.analysis.experimental.niche_detection"
"fyp.organize_datasets".msg = "flat alias shim; import fyp.analysis.organize_datasets"
"fyp.pca".msg = "flat alias shim; import fyp.analysis.pca"
"fyp.platform_scraper".msg = "flat alias shim; import fyp.scrape.platform_scraper"
"fyp.polars_ops".msg = "flat alias shim; import fyp.core.polars_ops"
"fyp.recode_variables".msg = "flat alias shim; import fyp.annotation.recode_variables"
"fyp.registry_metadata".msg = "flat alias shim; import fyp.core.registry_metadata"
"fyp.scrape_contract".msg = "flat alias shim; import fyp.scrape.scrape_contract"
"fyp.scrape_queues".msg = "flat alias shim; import fyp.scrape.scrape_queues"
"fyp.scrape_versioning".msg = "flat alias shim; import fyp.scrape.scrape_versioning"
"fyp.scraper_cookies".msg = "flat alias shim; import fyp.scrape.scraper_cookies"
"fyp.sequence_analysis".msg = "flat alias shim; import fyp.analysis.sequence_analysis"
"fyp.sequence_model".msg = "flat alias shim; import fyp.analysis.experimental.sequence_model"
"fyp.session_profile".msg = "flat alias shim; import fyp.analysis.experimental.session_profile"
"fyp.stats".msg = "flat alias shim; import fyp.analysis.stats"
"fyp.structure_sentinel".msg = "flat alias shim; import fyp.ingest.structure_sentinel"
"fyp.studies".msg = "flat alias shim; import fyp.analysis.studies"
"fyp.tiktok_dl".msg = "flat alias shim; import fyp.scrape.tiktok_dl"
"fyp.timeline_analysis".msg = "flat alias shim; import fyp.analysis.timeline_analysis"
"fyp.types".msg = "flat alias shim; import fyp.core.types"
"fyp.utils".msg = "flat alias shim; import fyp.core.utils"
"fyp.var_presentation".msg = "flat alias shim; import fyp.annotation.var_presentation"
"fyp.video_map".msg = "flat alias shim; import fyp.analysis.video_map"
"fyp.youtube_dl".msg = "flat alias shim; import fyp.scrape.youtube_dl"

[tool.ruff.lint.isort]
known-first-party = ["fyp", "web_interface"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

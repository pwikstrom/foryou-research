<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You Data Hub</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=31">
    {% block app_libs %}
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.js"></script>
    {% endblock %}
    <!-- Loaded in <head> so every body script, deferred or not, can format dates. -->
    <script src="{{ url_for('static', filename='js/datetime_format.js') }}?v=2"></script>
    <!-- Also <head>: it stamps html.fyp-floating-tooltips, which suppresses the
         ::after tooltips, so loading it late would flash the clipped ones. -->
    <script src="{{ url_for('static', filename='js/floating_tooltip.js') }}?v=2"></script>
    {% block head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>

</html>

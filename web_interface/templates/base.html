<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You Data Hub</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.js"></script>
    {% block head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='main.js') }}"></script>

    <script src="{{ url_for('static', filename='explore.js') }}?v=3"></script>
    <script src="{{ url_for('static', filename='video_analysis.js') }}?v=3"></script>
    <script src="{{ url_for('static', filename='correlations.js') }}"></script>
    <script src="{{ url_for('static', filename='timelines.js') }}"></script>
    <script src="{{ url_for('static', filename='collections.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>

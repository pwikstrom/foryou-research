<header class="public-header">
    <a href="{{ url_for('index') }}" class="public-wordmark">For You Research</a>
    <button id="public-nav-toggle" class="public-nav-toggle" aria-label="Menu" aria-expanded="false"
        onclick="togglePublicNav()">☰</button>
    <nav id="public-nav" class="public-nav">
        <a href="{{ url_for('index') }}" class="public-nav-link {% if active_page == 'landing' %}active{% endif %}">Home</a>
        <a href="{{ url_for('public_bp.participate') }}" class="public-nav-link {% if active_page == 'participate' %}active{% endif %}">Participate</a>
        <a href="{{ url_for('public_bp.thehub') }}" class="public-nav-link {% if active_page == 'thehub' %}active{% endif %}">The Hub</a>
        <a href="{{ url_for('public_bp.about') }}" class="public-nav-link {% if active_page == 'about' %}active{% endif %}">About</a>
        <a href="{{ url_for('public_bp.faq') }}" class="public-nav-link {% if active_page == 'faq' %}active{% endif %}">FAQ</a>
        <span class="public-nav-actions">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('index') }}" class="btn-primary public-cta">Open the hub</a>
            {% else %}
            <a href="{{ url_for('auth_bp.login') }}" class="public-nav-link">Log in</a>
            <a href="{{ url_for('auth_bp.signup') }}" class="btn-primary public-cta">Sign up</a>
            {% endif %}
        </span>
    </nav>
</header>

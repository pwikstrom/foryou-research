{% extends 'public/base_public.html' %}

{% block public_content %}

<!-- Hero image above the main title (anonymous visitors only). Logging in
     happens through the top-menu items, not an inline form. -->
{% if not current_user.is_authenticated %}
<section class="landing-login-hero">
    <figure class="landing-login-hero__media">
        <img src="{{ url_for('static', filename='landing/hero_collage.webp') }}"
            alt="The For You Data Hub: video analysis, timelines and semantic map views" loading="eager">
    </figure>
</section>
{% endif %}

{% include 'public/_landing_public_intro.html' %}
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    <div
        style="background: var(--color-bg-surface); padding: 40px; border-radius: 8px; box-shadow: var(--shadow-md); width: 100%; max-width: 400px; border: 1px solid var(--color-border);">
        <h2 style="text-align: center; margin-bottom: 24px;">Sign Up</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="auth-flash-error">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth_bp.signup') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                    style="width: 100%; padding: 8px 12px;">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                    style="width: 100%; padding: 8px 12px;">
            </div>

            <div>
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    style="width: 100%; padding: 8px 12px;">
            </div>

            <button type="submit" class="auth-submit-btn" style="width: 100%;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 16px; font-size: 14px; color: var(--color-text-muted);">
            Already have an account? <a href="{{ url_for('auth_bp.login') }}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}

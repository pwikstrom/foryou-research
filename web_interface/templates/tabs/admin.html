<div id="admin" class="tab-pane">

    <!-- Sidebar Navigation -->
    <nav class="dm-sidebar">
        <div class="dm-sidebar-item active" onclick="openAdminPage('admin-page-users', this)">
            Users
        </div>
        <div class="dm-sidebar-item" onclick="openAdminPage('admin-page-roles', this)">
            Roles
        </div>
        <div class="dm-sidebar-item" onclick="openAdminPage('admin-page-annotations', this)">
            User Annotations
        </div>
        <div class="dm-sidebar-item" onclick="openAdminPage('admin-page-reliability', this)">
            Inter-coder Reliability
        </div>
        <div class="dm-sidebar-item" onclick="openAdminPage('admin-page-general', this)">
            General
        </div>
    </nav>

    <!-- Content Area -->
    <div class="dm-content">

        <!-- Users (default) -->
        <div id="admin-page-users" class="dm-page active">
            {% include 'tabs/admin/users.html' %}
        </div>

        <!-- Roles -->
        <div id="admin-page-roles" class="dm-page">
            {% include 'tabs/admin/roles.html' %}
        </div>

        <!-- User Annotations -->
        <div id="admin-page-annotations" class="dm-page">
            {% include 'tabs/admin/annotations.html' %}
        </div>

        <!-- Inter-coder Reliability -->
        <div id="admin-page-reliability" class="dm-page">
            {% include 'tabs/admin/reliability.html' %}
        </div>

        <!-- General -->
        <div id="admin-page-general" class="dm-page">
            {% include 'tabs/admin/general.html' %}
        </div>

    </div>
</div>

<script>
    function openAdminPage(pageId, clickedItem) {
        // Hide all pages
        document.querySelectorAll('#admin .dm-page').forEach(page => {
            page.classList.remove('active');
        });

        // Deactivate all sidebar items
        document.querySelectorAll('#admin .dm-sidebar-item').forEach(item => {
            item.classList.remove('active');
        });

        // Show selected page
        const page = document.getElementById(pageId);
        if (page) {
            page.classList.add('active');
        }

        // Activate clicked sidebar item
        if (clickedItem) {
            clickedItem.classList.add('active');
        }
    }

    async function reloadVarSchema() {
        if (!confirm("Are you sure you want to reload the variable schema?")) return;

        try {
            const response = await fetch('/api/manage/schema/reload', {
                method: 'POST'
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to reload schema');
            }

            const data = await response.json();
            alert(data.message || 'Schema reloaded successfully');

        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function loadUsers() {
        try {
            const response = await fetch('/api/admin/users');
            if (!response.ok) throw new Error('Failed to load users');
            const users = await response.json();

            renderUsers(users);

            // Auto-load annotations if empty
            const annBody = document.getElementById('annotationsTableBody');
            if (annBody && annBody.rows.length <= 1 && annBody.innerHTML.includes('Click Refresh')) {
                loadAnnotations();
            }

            // Also load roles if we haven't already or to refresh
            loadRoles();

        } catch (error) {
            console.error('Error:', error);
            alert('Error loading users: ' + error.message);
        }
    }

    function renderUsers(users) {
        const pendingContainer = document.getElementById('pendingUserList');
        const tableBody = document.getElementById('userTableBody');

        if (!pendingContainer || !tableBody) {
            return; // UI not ready
        }

        // Split users
        const pending = users.filter(u => !u.approved);
        const active = users.filter(u => u.approved);

        // Render Pending
        if (pending.length === 0) {
            pendingContainer.innerHTML = '<p style="color: var(--color-success); margin: 0;">No pending approvals.</p>';
            pendingContainer.style.background = 'var(--color-bg-elevated)';
            pendingContainer.style.borderColor = 'var(--color-success)';
        } else {
            pendingContainer.style.background = 'var(--color-bg-elevated)';
            pendingContainer.style.borderColor = 'var(--color-warning)';
            let pendingHtml = '<ul style="list-style: none; padding: 0; margin: 0;">';
            pending.forEach(u => {
                pendingHtml += `
             <li style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--color-warning);">
                 <span><strong>${u.username}</strong> requested access as <em>${u.role}</em></span>
                 <button onclick="approveUser('${u.username}')" class="action-btn" style="padding: 6px 12px;">Approve</button>
             </li>`;
            });
            pendingHtml += '</ul>';
            pendingContainer.innerHTML = pendingHtml;
        }

        // Render Active
        if (active.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" style="padding: 16px; text-align: center; color: var(--color-text-faint);">No active users found.</td></tr>';
            return;
        }

        tableBody.innerHTML = active.map(user => {
            const stats = user.stats || { notes: 0, closed_tags: 0, open_tags: 0, unique_videos: 0, used_tags: [], user_notes: [] };
            const hasAnnotations = stats.used_tags.length > 0 || (stats.user_notes && stats.user_notes.length > 0);

            return `
        <tr style="border-bottom: 1px solid var(--color-border);">
            <td style="padding: 12px 16px;">
                <div style="display:flex; flex-direction:column;">
                    <span class="font-medium" style="color: var(--color-text-primary);">${user.username}</span>
                    ${hasAnnotations ? `<a href="#" onclick="toggleTags('${user.username}'); return false;" class="text-xxs" style="color: var(--color-info); text-decoration: none;">Show Annotations</a>` : ''}
                </div>
            </td>
            <td style="padding: 12px 16px;">
                <span class="text-xs" style="background: ${getRoleColor(user.role)}; color: var(--color-text-on-accent); padding: 2px 8px; border-radius: 12px;">${user.role}</span>
            </td>
            <td style="padding: 12px 16px; color: var(--color-text-primary);">
                <strong>${stats.unique_videos}</strong>
            </td>
            <td style="padding: 12px 16px; color: var(--color-text-primary);">
                ${stats.notes}
            </td>
            <td style="padding: 12px 16px; color: var(--color-text-primary);">
                ${stats.closed_tags}
            </td>
            <td style="padding: 12px 16px; color: var(--color-text-primary);">
                ${stats.open_tags}
            </td>
            <td style="padding: 12px 16px; color: var(--color-text-primary);">
                <span class="text-xs" style="color: var(--color-text-muted);">${user.last_login ? new Date(user.last_login).toLocaleString() : 'Never'}</span>
            </td>
            <td style="padding: 12px 16px; text-align: right;">
                 <button onclick="resetPassword('${user.username}')" class="action-btn text-xs" style="margin-right: 8px;">Reset Pwd</button>
                 <select onchange="updateRole('${user.username}', this.value)" class="role-select text-xs" data-current-role="${user.role}"
                    style="padding: 4px; border: 1px solid var(--color-border-strong); background: var(--color-bg-input); color: var(--color-text-primary); border-radius: 4px; margin-right: 8px;">
                    <!-- Populated dynamically -->
                </select>
                <button onclick="deleteUser('${user.username}')" class="action-btn btn-danger text-xs">Delete</button>
            </td>
        </tr>
        <tr id="tags-${user.username}" style="display: none; background: var(--color-bg-elevated); border-bottom: 2px solid var(--color-border);">
             <td colspan="8" style="padding: 12px 24px;">
                 <div style="display: flex; gap: 24px;">
                     <div style="flex: 1; min-width: 0;">
                        <h4 class="text-xs" style="margin: 0 0 8px 0; color: var(--color-text-primary);">Used Tags</h4>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            ${stats.used_tags.length > 0 ? stats.used_tags.map(t => `<span class="text-xs" style="background: var(--color-border); padding: 2px 8px; border-radius: 12px; color: var(--color-text-primary);">${t}</span>`).join('') : '<span class="text-xs" style="color: var(--color-text-muted);">None</span>'}
                        </div>
                     </div>
                     <div style="flex: 1; min-width: 0;">
                        <h4 class="text-xs" style="margin: 0 0 8px 0; color: var(--color-text-primary);">Notes</h4>
                        <div style="display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto;">
                            ${stats.user_notes && stats.user_notes.length > 0 ? stats.user_notes.map(n => `<div class="text-xs" style="background: var(--color-border); padding: 6px 10px; border-radius: 4px; color: var(--color-text-primary);"><span class="font-mono" style="color:var(--color-text-muted); margin-right: 6px;">${n.item}:</span>${n.text}</div>`).join('') : '<span class="text-xs" style="color: var(--color-text-muted);">None</span>'}
                        </div>
                     </div>
                 </div>
             </td>
        </tr>
    `}).join('');

        // After rendering users, populate their role dropdowns
        if (window.availableRoles) {
            users.forEach(u => {
                const select = document.querySelector(`select[onchange="updateRole('${u.username}', this.value)"]`);
                if (select) {
                    populateRoleSelect(select, window.availableRoles, u.role);
                }
            });
        }
    }

    function toggleTags(username) {
        const row = document.getElementById(`tags-${username}`);
        if (row) {
            row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
        }
    }

    function getRoleColor(role) {
        switch (role) {
            case 'admin': return 'var(--color-danger)';
            case 'researcher': return 'var(--color-info)';
            case 'viewer': return 'var(--color-text-faint)';
            default: return 'var(--color-text-faint)';
        }
    }

    async function approveUser(username) {
        try {
            const response = await fetch('/api/admin/users', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'approve', username: username })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to approve user');
            }

            loadUsers(); // Refresh list
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function resetPassword(username) {
        const newPassword = prompt(`Enter new password for ${username}:`);
        if (!newPassword) return;

        try {
            const response = await fetch('/api/admin/users', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'reset_password', username: username, new_password: newPassword })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to reset password');
            }

            alert('Password updated successfully');
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function addUser() {
        const username = document.getElementById('newUsername').value;
        const password = document.getElementById('newPassword').value;
        const role = document.getElementById('newRole').value;

        if (!username || !password) {
            alert('Please enter both username and password');
            return;
        }

        try {
            const response = await fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to add user');
            }

            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            loadUsers();
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function deleteUser(username) {
        if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;

        try {
            const response = await fetch(`/api/admin/users?username=${username}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to delete user');
            }

            loadUsers();
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    async function updateRole(username, newRole) {
        try {
            const response = await fetch('/api/admin/users', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'change_role',
                    username: username,
                    role: newRole
                })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to update role');
            }

            loadUsers();
        } catch (error) {
            alert('Error: ' + error.message);
            loadUsers(); // Reset UI
        }
    }

    async function loadAnnotations() {
        const tableBody = document.getElementById('annotationsTableBody');
        tableBody.innerHTML = '<tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--color-text-muted);">Loading annotations...</td></tr>';

        try {
            const response = await fetch('/api/admin/annotations');
            if (!response.ok) throw new Error('Failed to load annotations');
            const data = await response.json();
            renderAnnotations(data);
        } catch (error) {
            console.error('Error:', error);
            tableBody.innerHTML = `<tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--color-danger);">Error: ${error.message}</td></tr>`;
        }
    }

    function renderAnnotations(items) {
        const tableBody = document.getElementById('annotationsTableBody');
        if (!tableBody) return;

        if (items.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="padding: 16px; text-align: center; color: var(--color-text-muted);">No annotations found.</td></tr>';
            return;
        }

        tableBody.innerHTML = items.map(item => {
            const stats = item.stats;
            // Safe JSON stringify for the data attribute
            const detailsJson = JSON.stringify(item.details).replace(/"/g, '&quot;');

            return `
            <tr style="border-bottom: 1px solid var(--color-border);">
                <td class="font-mono text-xs" style="padding: 12px 16px; color: var(--color-text-primary);">${item.item_id}</td>
                <td style="padding: 12px 16px; color: var(--color-text-primary);"><strong>${stats.unique_users || 0}</strong></td>
                <td style="padding: 12px 16px; color: var(--color-text-primary);">${stats.notes}</td>
                <td style="padding: 12px 16px; color: var(--color-text-primary);">${stats.closed_tags}</td>
                <td style="padding: 12px 16px; color: var(--color-text-primary);">${stats.open_tags}</td>
                <td style="padding: 12px 16px; text-align: right;">
                    <button onclick="toggleAnnotationDetails('${item.item_id}', this)" class="btn-discreet text-xs" style="padding: 4px 10px;">
                        Expand
                    </button>
                    <!-- Hidden data store for simpler access -->
                    <div id="data-${item.item_id}" style="display:none;">${detailsJson}</div>
                </td>
            </tr>
            <tr id="details-${item.item_id}" style="display: none; background: var(--color-bg-elevated); border-bottom: 2px solid var(--color-border);">
                <td colspan="6" style="padding: 0;">
                    <div id="content-${item.item_id}" style="padding: 16px; color: var(--color-text-primary);">Loading details...</div>
                </td>
            </tr>
            `;
        }).join('');
    }

    function toggleAnnotationDetails(itemId, btn) {
        const row = document.getElementById(`details-${itemId}`);
        const contentDiv = document.getElementById(`content-${itemId}`);
        const dataDiv = document.getElementById(`data-${itemId}`);

        if (!row || !contentDiv || !dataDiv) return;

        if (row.style.display === 'none') {
            // Expand
            row.style.display = 'table-row';
            if (btn) btn.innerText = "Collapse";

            // Render content if not already done
            try {
                const details = JSON.parse(dataDiv.textContent);
                renderAnnotationDetails(contentDiv, details);
            } catch (e) {
                console.error("Error parsing details", e);
                contentDiv.innerHTML = "Error loading details.";
            }
        } else {
            // Collapse
            row.style.display = 'none';
            if (btn) btn.innerText = "Expand";
        }
    }

    function renderAnnotationDetails(container, details) {
        if (Object.keys(details).length === 0) {
            container.innerHTML = '<p class="italic" style="color: var(--color-text-muted);">No details available.</p>';
            return;
        }

        let html = '<div style="display: flex; flex-direction: column; gap: 16px;">';

        for (const [variable, data] of Object.entries(details)) {
            html += `
            <div style="border: 1px solid var(--color-border); background: var(--color-bg-primary); border-radius: 6px; padding: 12px;">
                <h4 class="text-sm" style="margin-top: 0; margin-bottom: 8px; color: var(--color-text-heading); border-bottom: 1px solid var(--color-border); padding-bottom: 6px;">${data.label || variable}</h4>

                <div style="display: flex; flex-direction: column; gap: 8px;">
            `;

            // Open Tags
            if (Object.keys(data.open).length > 0) {
                html += `<div><span class="text-xxs uppercase font-semibold" style="color: var(--color-text-muted);">Tags:</span> <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">`;
                for (const [tag, users] of Object.entries(data.open)) {
                    const count = users.length;
                    const userList = users.join(', ');
                    html += `<span title="Used by: ${userList}" class="text-xs" style="background: var(--color-info); color: var(--color-text-primary); padding: 2px 8px; border-radius: 12px; cursor: help;">${tag} <span style="opacity: 0.7; font-size: 10px;">(${count})</span></span>`;
                }
                html += `</div></div>`;
            }

            // Closed Tags
            if (Object.keys(data.closed).length > 0) {
                html += `<div><span class="text-xxs uppercase font-semibold" style="color: var(--color-text-muted);">Closed Tags:</span> <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;">`;
                for (const [val, users] of Object.entries(data.closed)) {
                    const count = users.length;
                    const userList = users.join(', ');
                    html += `<span title="Selected by: ${userList}" class="text-xs" style="background: var(--color-success); color: var(--color-text-primary); padding: 2px 8px; border-radius: 12px; cursor: help;">${val} <span style="opacity: 0.7; font-size: 10px;">(${count})</span></span>`;
                }
                html += `</div></div>`;
            }

            // Notes
            if (data.notes.length > 0) {
                html += `<div><span class="text-xxs uppercase font-semibold" style="color: var(--color-text-muted);">Notes:</span> <ul class="text-xs" style="margin: 4px 0 0 0; padding-left: 20px; color: var(--color-text-primary);">`;
                for (const note of data.notes) {
                    html += `<li title="By: ${note.user}" style="cursor: help; margin-bottom: 4px;">${note.text}</li>`;
                }
                html += `</ul></div>`;
            }

            html += `</div></div>`; // Close card and inner container
        }

        html += '</div>';
        container.innerHTML = html;
    }

    async function calculateReliability() {
        const tableBody = document.getElementById('reliabilityTableBody');
        tableBody.innerHTML = '<tr><td colspan="5" style="padding: 16px; text-align: center; color: var(--color-text-muted);">Calculating...</td></tr>';

        try {
            const response = await fetch('/api/manage/inter_coder_reliability');
            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Failed to calculate reliability');
            }
            const data = await response.json();

            if (data.results && data.results.length > 0) {
                tableBody.innerHTML = data.results.map(row => `
                    <tr style="border-bottom: 1px solid var(--color-border);">
                        <td class="font-medium" style="padding: 12px 16px; color: var(--color-text-primary);">${row.variable}</td>
                        <td style="padding: 12px 16px; color: var(--color-text-primary);">${row.avg_agreement}%</td>
                        <td class="font-bold" style="padding: 12px 16px; color: ${getKappaColor(row.avg_kappa)};">${row.avg_kappa}</td>
                        <td style="padding: 12px 16px; color: var(--color-text-primary);">${row.n_raters}</td>
                        <td style="padding: 12px 16px; color: var(--color-text-primary);">${row.avg_items}</td>
                    </tr>
                 `).join('');
            } else {
                tableBody.innerHTML = '<tr><td colspan="5" style="padding: 16px; text-align: center; color: var(--color-text-muted);">No data found (need at least 2 common items per user).</td></tr>';
            }

        } catch (error) {
            console.error('Error:', error);
            tableBody.innerHTML = `<tr><td colspan="5" style="padding: 16px; text-align: center; color: var(--color-danger);">Error: ${error.message}</td></tr>`;
        }
    }

    function getKappaColor(k) {
        if (k >= 0.8) return 'var(--color-accent)'; // Excellent
        if (k >= 0.6) return 'var(--color-success-light)'; // Good
        if (k >= 0.4) return 'var(--color-gold)'; // Moderate
        if (k >= 0.2) return 'var(--color-warning)'; // Fair
        return 'var(--color-danger)'; // Poor
    }

    // --- Role Management ---

    async function loadRoles() {
        try {
            const response = await fetch('/api/admin/roles');
            if (!response.ok) throw new Error("Failed to load roles");
            const roles = await response.json();
            window.availableRoles = roles; // Store globally regarding this scope
            renderRoles(roles);
            updateRoleSelects(roles);
        } catch (e) {
            console.error(e);
            alert("Error loading roles: " + e.message);
        }
    }

    function renderRoles(roles) {
        const container = document.getElementById('roleList');
        if (!container) return;

        container.innerHTML = roles.map(role => `
            <div style="background: var(--color-border); padding: 6px 12px; border-radius: 20px; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; border: 1px solid var(--color-border-strong);">
                <span>${role}</span>
                ${role !== 'admin' ?
                `<span onclick="deleteRole('${role}')" class="text-body font-bold" style="cursor: pointer; color: var(--color-danger);">&times;</span>`
                : ''}
            </div>
        `).join('');
    }

    function updateRoleSelects(roles) {
        // Update "New User" select
        const newRoleSelect = document.getElementById('newRole');
        if (newRoleSelect) {
            populateRoleSelect(newRoleSelect, roles, 'viewer');
        }

        // Update existing users dropdowns if already rendered
        const userSelects = document.querySelectorAll('.role-select');
        userSelects.forEach(sel => {
            const currentRole = sel.getAttribute('data-current-role');
            populateRoleSelect(sel, roles, currentRole);
        });
    }

    function populateRoleSelect(select, roles, current = null) {
        select.innerHTML = roles.map(r =>
            `<option value="${r}" ${r === current ? 'selected' : ''}>${r.charAt(0).toUpperCase() + r.slice(1)}</option>`
        ).join('');
    }

    async function addRole() {
        const nameInput = document.getElementById('newRoleName');
        const roleName = nameInput.value.trim();
        if (!roleName) return;

        try {
            const response = await fetch('/api/admin/roles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role_name: roleName })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || "Failed");
            }

            nameInput.value = '';
            loadRoles();
        } catch (e) {
            alert(e.message);
        }
    }

    async function deleteRole(roleName) {
        if (!confirm(`Are you sure you want to delete role '${roleName}'?`)) return;

        try {
            const response = await fetch(`/api/admin/roles?role_name=${encodeURIComponent(roleName)}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || "Failed");
            }

            loadRoles();
        } catch (e) {
            alert(e.message);
        }
    }

</script>

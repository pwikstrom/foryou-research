<!-- Active Users sub-page -->
<h2 style="margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center;">
    Active Users
    <button onclick="loadUsers()" class="btn-discreet"
        style="padding: 6px 12px;">
        ↻ Refresh List
    </button>
</h2>

<!-- Orphan placeholder participant accounts (hidden when none) -->
<div id="orphanParticipantsNotice" style="display: none; align-items: center; justify-content: space-between; gap: 12px; background: var(--color-bg-elevated); border: 1px solid var(--color-warning); border-radius: 6px; padding: 10px 16px; margin-bottom: 16px;">
    <span id="orphanParticipantsText" class="text-sm" style="color: var(--color-text-primary);"></span>
    <button id="orphanParticipantsBtn" onclick="removeOrphanParticipants()" class="btn-discreet" style="padding: 6px 12px; flex-shrink: 0;">Remove orphan accounts</button>
</div>

<!-- Table controls: free-text search + the participant-account toggle.
     Both filter client-side over the payload already fetched. -->
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px;">
    <input type="search" id="activeUsersSearch" placeholder="Search users by name, email or role&hellip;"
        oninput="filterActiveUsers()" class="text-sm"
        style="flex: 0 1 320px; min-width: 200px; padding: 6px 10px; border: 1px solid var(--color-border); border-radius: 4px; background: var(--color-bg-input); color: var(--color-text-primary);">
    <label class="text-sm" style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--color-text-primary);">
        <input type="checkbox" id="activeUsersIncludeParticipants" checked onchange="filterActiveUsers()">
        Include participant accounts
    </label>
    <span id="activeUsersCount" class="text-xs" style="color: var(--color-text-muted);"></span>
</div>

<div style="overflow-x: auto;">
    <table id="activeUsersTable"
        style="width: 100%; border-collapse: collapse; background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 8px;">
        <thead>
            <tr style="background: var(--color-bg-elevated);">
                <th data-sort-key="display_username"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('display_username')">
                    Username <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="username"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('username')">
                    Email <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="role"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('role')">
                    Role <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="last_login"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('last_login')">
                    Last Login <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="created_at"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('created_at')">
                    Registered <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="collections"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('collections')">
                    Collections <span class="sort-indicator"></span>
                </th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr>
                <td colspan="6" style="padding: 16px; text-align: center; color: var(--color-text-muted);">Loading
                    users...
                </td>
            </tr>
        </tbody>
    </table>
</div>

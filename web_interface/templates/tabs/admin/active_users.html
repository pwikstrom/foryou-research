<!-- Active Users sub-page -->
<h2 style="margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center;">
    Active Users
    <button onclick="loadUsers()" class="btn-discreet"
        style="padding: 6px 12px;">
        ↻ Refresh List
    </button>
</h2>

<div style="overflow-x: auto;">
    <table id="activeUsersTable"
        style="width: 100%; border-collapse: collapse; background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 8px;">
        <thead>
            <tr style="background: var(--color-bg-elevated);">
                <th data-sort-key="username"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('username')">
                    Username <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="role"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('role')">
                    Role <span class="sort-indicator"></span>
                </th>
                <th data-sort-key="last_login"
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary); cursor: pointer; user-select: none;"
                    onclick="sortActiveUsers('last_login')">
                    Last Login <span class="sort-indicator"></span>
                </th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr>
                <td colspan="3" style="padding: 16px; text-align: center; color: var(--color-text-muted);">Loading
                    users...
                </td>
            </tr>
        </tbody>
    </table>
</div>

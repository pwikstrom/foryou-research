<!-- User Annotations sub-page -->
<h2 style="margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center;">
    User Annotations
    <button onclick="loadAnnotations()" class="btn-discreet"
        style="padding: 6px 12px;">
        ↻ Refresh Annotations
    </button>
</h2>

<div style="overflow-x: auto;">
    <table
        style="width: 100%; border-collapse: collapse; background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 8px;">
        <thead>
            <tr style="background: var(--color-bg-elevated);">
                <th
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Item ID
                </th>
                <th
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Unique
                    Users</th>
                <th
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Total
                    Notes</th>
                <th
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Total
                    Closed</th>
                <th
                    style="text-align: left; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Total
                    Open</th>
                <th
                    style="text-align: right; padding: 12px 16px; border-bottom: 2px solid var(--color-border); color: var(--color-text-primary);">
                    Actions
                </th>
            </tr>
        </thead>
        <tbody id="annotationsTableBody">
            <tr>
                <td colspan="6" style="padding: 16px; text-align: center; color: var(--color-text-muted);">Click Refresh to
                    load annotations.</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Daily Ops Report sub-page -->
<h2 style="margin: 0 0 16px 0;">Daily Ops Report</h2>

<div class="setting-group" style="margin-bottom: 20px;">
    <div id="ops-report-meta" class="text-sm" style="color: var(--color-text-muted); margin-bottom: 10px;">
        <span class="italic">Loading report status...</span>
    </div>
    <div style="background: var(--color-bg-inset); border-radius: 6px; border: 1px solid var(--color-border); overflow: hidden;">
        <!-- allow-same-origin (but NOT allow-scripts): the session cookie must
             accompany the iframe's request, while any script in the stored
             report stays inert. -->
        <iframe id="ops-report-frame" title="Daily ops report" sandbox="allow-same-origin"
            style="width: 100%; height: 78vh; border: 0; display: block; background: transparent;"></iframe>
    </div>
    <div class="text-xs" style="color: var(--color-text-muted); margin-top: 8px;">
        Generated every morning on the task runner and emailed to the site
        address. Colour code: red = action needed, yellow = watch,
        blue = informational activity, green = checked and healthy.
    </div>
    <button id="ops-report-run-btn" class="btn-primary" style="margin-top: 10px;"
        onclick="runOpsReportNow()">Generate now</button>
</div>

<script src="{{ url_for('static', filename='js/admin_ops_report.js') }}?v=1"></script>

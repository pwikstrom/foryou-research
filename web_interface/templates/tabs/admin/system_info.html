<!-- System Information sub-page -->
<h2 style="margin: 0 0 16px 0;">System Information</h2>

<div class="setting-group" style="margin-bottom: 20px;">
    <div id="system-info-container"
        style="background: var(--color-bg-inset); padding: 15px; border-radius: 6px; border: 1px solid var(--color-border);">
        <span class="italic text-sm" style="color: var(--color-text-faint);">Loading system info...</span>
    </div>
</div>

<h2 style="margin: 24px 0 16px 0;">System Health</h2>

<div class="setting-group" style="margin-bottom: 20px;">
    <div id="system-health-container"
        style="background: var(--color-bg-inset); padding: 15px; border-radius: 6px; border: 1px solid var(--color-border);">
        <span class="italic text-sm" style="color: var(--color-text-faint);">Loading health status...</span>
    </div>
    <div class="text-xs" style="color: var(--color-text-muted); margin-top: 8px;">
        Test-scrapes one recent item per platform (metadata only), probes the first bytes of its media,
        and pings Gemini. Runs automatically at server boot; nothing is written to the datasets.
    </div>
    <button id="run-health-check-btn" class="btn-primary" style="margin-top: 10px;"
        onclick="runSystemHealthCheck()">Run health check</button>
</div>

<script src="{{ url_for('static', filename='js/admin_system_info.js') }}"></script>

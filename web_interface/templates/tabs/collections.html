<div id="collections" class="tab-pane">
    <div class="control-bar">
        <div class="header-with-help">
            <h3>Collections</h3>
            <button class="help-icon" onclick="showHelp('collections')">?</button>
        </div>
        <div class="control-group" style="display: flex; align-items: center; gap: 15px;">
            <span id="pe-stats-timestamp" style="display:none;"></span>
            <span id="pe-stats-count" class="timestamp-text text-sm" style="color: var(--control-bar-info);"></span>
        </div>
    </div>

    <div class="pe-container">
        <!-- Main Panel: Metric Strip Plots (full width) -->
        <div class="pe-main">
            <div class="panel-card" style="overflow-y: auto;">
                <h4>Distribution by Metric</h4>
                <p class="helper-text">Each dot represents a collection. Click any dot to select it. The selected collection is highlighted in red.</p>
                <div id="pe-strips-container" class="strips-container">
                </div>
            </div>
        </div>
    </div>

</div>

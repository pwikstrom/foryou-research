<div id="correlations" class="tab-pane">

    <!-- Control Bar — every control lives here (Timelines layout): compact
         type, abbreviated labels, and the unit-of-analysis copy behind an (i)
         icon rather than a full-width banner. -->
    <div class="control-bar corr-control-bar">

        <!-- View toggle — buttons are built by correlations.js from the
             server's stat-view manifest (metadata.views) -->
        <div class="toggle-group corr-view-toggle" id="pca-view-toggle"></div>

        <!-- Unit-of-analysis explainer (the long "Each point/row is one …"
             copy, on hover instead of always on screen) -->
        <div id="corr-unit-info" class="timelines-info-icon-wrapper corr-info-wrapper" style="display: none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer; vertical-align: middle;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <div id="corr-unit-tooltip" class="timelines-info-tooltip corr-info-tooltip text-xs"></div>
        </div>

        <!-- Scatter Controls -->
        <div id="pca-scatter-controls" class="corr-scatter-controls">
            <label class="corr-control-label" for="pca-x-select">X:</label>
            <select id="pca-x-select" class="dropdown corr-select" onchange="updatePcaPlot()"></select>

            <label class="corr-control-label" for="pca-y-select">Y:</label>
            <select id="pca-y-select" class="dropdown corr-select" onchange="updatePcaPlot()"></select>

            <label class="corr-control-label" for="pca-color-select">Colour:</label>
            <select id="pca-color-select" class="dropdown corr-select-narrow" onchange="updatePcaPlot()"></select>

            <label class="corr-checkbox-group text-xs meta-tooltip tooltip-below"
                data-tooltip="Ordinary least squares line with slope, 95% confidence interval, r, R², p and n — computed on every group in the study, not just the plotted sample.">
                <input type="checkbox" id="pca-show-stats" onchange="updatePcaPlot()">
                Regression
            </label>

            <label class="corr-checkbox-group text-xs meta-tooltip tooltip-below"
                data-tooltip="95%-coverage confidence ellipses per colour group, built from each group's covariance (orientation reflects the x–y correlation within the group).">
                <input type="checkbox" id="pca-show-ellipses" onchange="updatePcaPlot()">
                Ellipses
            </label>
        </div>

        <!-- Heatmap Controls -->
        <div id="pca-heatmap-controls" class="corr-scatter-controls" style="display: none;">
            <label class="corr-control-label" for="pca-method-select">Method:</label>
            <select id="pca-method-select" class="dropdown corr-select-narrow" onchange="loadCorrelationHeatmap()">
                <option value="pearson">Pearson</option>
                <option value="spearman">Spearman</option>
            </select>

            <label class="corr-checkbox-group text-xs meta-tooltip tooltip-below"
                data-tooltip="Blank out cells whose association is not statistically reliable after correcting for the number of pairs tested (Benjamini–Hochberg q ≥ .05).">
                <input type="checkbox" id="pca-mask-nonsig" onchange="rerenderHeatmapFromCache()">
                Hide n.s.
            </label>

            <button id="pca-export-csv" class="btn-discreet text-xxs corr-bar-button" onclick="exportCorrelationCsv()">Download CSV</button>
        </div>

        <!-- Applies to Scatter + Heatmap, so it follows the view-specific
             controls in the same left-to-right reading order. -->
        <label id="pca-center-wrap" class="corr-checkbox-group text-xs meta-tooltip tooltip-below"
            data-tooltip="Subtract each collection's own average first, so associations reflect variation within a collection's feed rather than differences between collections.">
            <input type="checkbox" id="pca-center-toggle" onchange="refreshCurrentView()">
            Within-collection
        </label>

        <!-- Status / errors only (the observation count sits on the plot) -->
        <span id="pca-status" class="text-xs corr-status corr-bar-status"></span>
    </div>

    <!-- Main Content -->
    <div class="corr-main">

        <!-- Visualization Panel -->
        <div class="panel corr-viz-panel">

            <!-- Freshness banner (warning only; the unit copy lives on the (i)) -->
            <div id="corr-stale-banner" class="corr-banner corr-banner-warn" style="display: none;"></div>

            <!-- Plot / table area, with the observation count in its corner -->
            <div class="corr-plot-wrap">
                <span id="pca-point-count" class="text-xs corr-obs-badge"></span>
                <div id="pca-plot" class="corr-plot"></div>
            </div>

            <!-- Plain-language caption -->
            <div id="corr-caption" class="corr-caption" style="display: none;"></div>

        </div>

    </div>
</div>

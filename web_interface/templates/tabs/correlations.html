<div id="correlations" class="tab-pane">
    <div class="control-bar">
        <button id="correlations-sidebar-toggle" onclick="window.correlationsToggleSidebar()"
            class="meta-tooltip tooltip-below desktop-only-toggle corr-sidebar-toggle" data-tooltip="Toggle filters panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--control-bar-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>
        <button class="mobile-only mobile-drawer-trigger corr-drawer-trigger" data-drawer-target="#correlations-filter-panel">Filters</button>
        <span id="pca-status" class="corr-status"></span>
    </div>

    <!-- Main Content -->
    <div class="corr-main">

        <!-- Filter Panel -->
        <div id="correlations-filter-panel" class="panel corr-filter-panel" data-mobile-drawer="left">
            <div class="header">
                <h2>Filters</h2>
                <button class="btn-save" onclick="resetPcaFilters()">Reset</button>
            </div>
            <div id="pca-filters" class="corr-filter-list">
            </div>
        </div>

        <!-- Visualization Panel -->
        <div class="panel corr-viz-panel">

            <!-- Plot Controls -->
            <div class="corr-controls">

                <!-- View toggle — buttons are built by correlations.js from the
                     server's stat-view manifest (metadata.views) -->
                <div class="corr-view-toggle">
                    <div class="toggle-group" id="pca-view-toggle"></div>
                </div>

                <!-- Scatter Controls -->
                <div id="pca-scatter-controls" class="corr-scatter-controls">
                    <div>
                        <label class="corr-control-label">X Axis:</label>
                        <select id="pca-x-select" class="dropdown corr-select" onchange="updatePcaPlot()">
                        </select>
                    </div>
                    <div>
                        <label class="corr-control-label">Y Axis:</label>
                        <select id="pca-y-select" class="dropdown corr-select" onchange="updatePcaPlot()">
                        </select>
                    </div>
                    <div>
                        <label class="corr-control-label">Colour by:</label>
                        <select id="pca-color-select" class="dropdown corr-select-narrow" onchange="updatePcaPlot()">
                        </select>
                    </div>
                    <!-- Stats Toggle -->
                    <div class="corr-checkbox-group meta-tooltip tooltip-below"
                        data-tooltip="Ordinary least squares line with slope, 95% confidence interval, r, R², p and n — computed on all filtered groups, not just the plotted sample.">
                        <input type="checkbox" id="pca-show-stats" onchange="updatePcaPlot()">
                        <label for="pca-show-stats" class="font-normal corr-checkbox-label">Regression</label>
                    </div>
                    <!-- Ellipses Toggle -->
                    <div class="corr-checkbox-group meta-tooltip tooltip-below"
                        data-tooltip="95%-coverage confidence ellipses per colour group, built from each group's covariance (orientation reflects the x–y correlation within the group).">
                        <input type="checkbox" id="pca-show-ellipses" onchange="updatePcaPlot()">
                        <label for="pca-show-ellipses" class="font-normal corr-checkbox-label">Ellipses</label>
                    </div>
                </div>

                <!-- Heatmap Controls -->
                <div id="pca-heatmap-controls" class="corr-scatter-controls" style="display: none;">
                    <div>
                        <label class="corr-control-label">Method:</label>
                        <select id="pca-method-select" class="dropdown corr-select-narrow" onchange="loadCorrelationHeatmap()">
                            <option value="pearson">Pearson</option>
                            <option value="spearman">Spearman</option>
                        </select>
                    </div>
                    <div class="corr-checkbox-group meta-tooltip tooltip-below"
                        data-tooltip="Blank out cells whose association is not statistically reliable after correcting for the number of pairs tested (Benjamini–Hochberg q ≥ .05).">
                        <input type="checkbox" id="pca-mask-nonsig" onchange="rerenderHeatmapFromCache()">
                        <label for="pca-mask-nonsig" class="font-normal corr-checkbox-label">Hide non-significant</label>
                    </div>
                    <div class="corr-checkbox-group meta-tooltip tooltip-below"
                        data-tooltip="Correct correlations for annotation measurement error (Spearman disattenuation: r ÷ √(reliability × reliability)). Reliability comes from machine test-retest runs and human–machine agreement; cells without an estimate are blanked. Approximate — treat as an upper bound.">
                        <input type="checkbox" id="pca-disattenuate" onchange="rerenderHeatmapFromCache()">
                        <label for="pca-disattenuate" class="font-normal corr-checkbox-label">Correct for noise</label>
                    </div>
                    <button id="pca-export-csv" class="btn-discreet" onclick="exportCorrelationCsv()">Download CSV</button>
                </div>

                <!-- Centering Toggle (applies to both views) -->
                <div class="corr-checkbox-group meta-tooltip tooltip-below"
                    data-tooltip="Subtract each collection's own average first, so associations reflect variation within a donor's feed rather than differences between donors.">
                    <input type="checkbox" id="pca-center-toggle" onchange="refreshCurrentView()">
                    <label for="pca-center-toggle" class="font-normal corr-checkbox-label">Within-collection</label>
                </div>

                <!-- Point Count (right-aligned) -->
                <div class="corr-point-count">
                    <span id="pca-point-count" class="text-sm corr-status"></span>
                </div>
            </div>

            <!-- Unit-of-analysis + freshness banners -->
            <div id="corr-unit-banner" class="corr-banner" style="display: none;"></div>
            <div id="corr-stale-banner" class="corr-banner corr-banner-warn" style="display: none;"></div>

            <!-- Plot Area -->
            <div id="pca-plot" class="corr-plot"></div>

            <!-- Plain-language caption -->
            <div id="corr-caption" class="corr-caption" style="display: none;"></div>

        </div>

    </div>
</div>

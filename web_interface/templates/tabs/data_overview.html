<div id="data_overview" class="tab-pane">
    <!-- Tab-Specific Control Bar -->
    <div class="panel"
        style="margin-bottom: 20px; display: flex; flex-direction: row; align-items: center; gap: 20px; padding: 5px 15px; width: auto;">
        <input type="text" id="overview-study-name" placeholder="Study Name" value="everything"
            style="width: 25ch; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 5px;">
    </div>

    <div class="container" style="flex-direction: row; gap: 20px;">
        <!-- Single Column -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
            <!-- Create Item Subsets Panel -->
            <div class="panel" style="flex: 1;">
                <div class="header">
                    <h2>Create Item Subsets</h2>
                    <div class="controls">
                        <span id="create_subsets-status" class="status-indicator status-stopped"></span>
                        <button class="btn-start" onclick="startProcess('create_subsets')">Run</button>
                        <button class="btn-stop" onclick="stopProcess('create_subsets')">Stop</button>
                        <button class="btn-save" style="background: #555; font-size: 0.8em;"
                            onclick="clearLogs('create_subsets')">Clear</button>
                    </div>
                </div>
                <!-- Optional: Hide progress bar if not needed, or keep for consistency -->
                <div class="progress-container">
                    <div class="progress-bar" id="create_subsets-bar"></div>
                    <div class="progress-text" id="create_subsets-text">Idle</div>
                </div>
                <div class="log-window" id="create_subsets-logs">Logs will appear here...</div>
            </div>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
            <div class="panel" style="flex: 1;">
                <div class="header">
                    <h2>Results</h2>
                </div>
                <div id="subsets-pie-chart" style="width:100%; height:100%;"></div>
            </div>
        </div>
    </div>
</div> <!-- End of Data Overview Tab -->

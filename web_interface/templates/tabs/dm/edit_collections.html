<!-- Edit Collections sub-page -->
<h2 style="margin: 0 0 16px 0; display: flex; align-items: center; gap: 15px;">
    Edit Collections
    <input type="text" id="edit-activity-search" placeholder="Search collections..."
        class="control-input text-sm"
        style="width: 250px; padding: 6px 8px; font-weight: var(--weight-normal);"
        onkeyup="filterEditActivityCollections(this)">
    <button type="button" class="action-btn text-sm" id="edit-selected-collections-btn"
        onclick="openEditSelectedCollections()" disabled>Edit</button>
    {% if current_user.is_admin() %}
    <button type="button" class="btn-discreet text-xs" id="refresh-metadata-btn"
        onclick="refreshCollectionMetadata(this)"
        style="margin-left: auto;">Refresh Collections Metadata</button>
    {% endif %}
</h2>

<div class="edit-activity-selector" style="border: 1px solid var(--color-border-strong); background: var(--color-border); border-radius: 4px;">
    <div id="edit-activity-list-container" class="edit-activity-checklist-container"
        style="max-height: calc(100vh - 260px); overflow-y: auto; overflow-x: auto; text-align: left; background: var(--color-bg-elevated); padding: 0;">
        <div style="padding: 10px; color: var(--color-text-secondary);">Loading collections...</div>
    </div>
</div>

<!-- Edit Collection Modal -->
<div id="editCollectionModal" class="modal"
    style="display:none;">
    <!-- Wider than the usual 50%: the modal now carries the collection metadata
         the table no longer shows, and in multi-select mode that is a row per
         selected collection. -->
    <div class="modal-content"
        style="width: 70%; max-width: 1000px;">
        <span class="close" onclick="closeEditCollectionModal()">&times;</span>
        <h2 style="margin-top: 0;">Edit Collection: <span id="edit-collection-id-display"></span></h2>

        <input type="hidden" id="edit-collection-id" value="">

        <div class="form-group" style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Display ID:</label>
            <input type="text" id="edit-collection-display-id" class="control-input"
                style="width: 100%; padding: 8px;">
        </div>

        <div class="form-group">
            <label style="display: block; margin-bottom: 5px;">Tags:</label>
            <div id="edit-collection-tags-container"
                style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;">
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="edit-collection-new-tag" class="control-input"
                    style="flex: 1; padding: 8px;"
                    placeholder="Add new tag..."
                    onkeydown="if(event.key === 'Enter') { dm_addNewTag(); event.preventDefault(); }">
                <button type="button" class="action-btn" onclick="dm_addNewTag()" style="padding: 8px 15px;">Add Tag</button>
            </div>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" id="edit-collection-hidden" style="width: auto; cursor: pointer;">
                Hide Collection
            </label>
            <span class="text-sm" style="color: var(--color-text-tertiary); margin-left: 25px; display: block;">Hidden collections are
                not shown in the primary study interface.</span>
        </div>

        <!-- Read-only metadata. The Edit Collections table shows only what you
             need to find a collection; everything else it holds is reported
             here, for the one collection or for each of the selected ones. -->
        <div class="form-group" style="margin-top: 20px;">
            <label style="display: block; margin-bottom: 5px;">Collection details:</label>
            <div id="edit-collection-details" class="text-sm"
                style="max-height: 240px; overflow: auto; border: 1px solid var(--color-border-strong); background: var(--color-bg-elevated); padding: 8px 10px;">
            </div>
        </div>

        <div style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
            {% if current_user.is_admin() %}
            <button type="button" class="action-btn btn-danger" id="delete-collection-btn"
                onclick="dm_deleteCollection()">Delete Collection</button>
            {% else %}
            <span></span>
            {% endif %}
            <div style="display: flex; gap: 10px;">
                <button type="button" class="action-btn btn-secondary" style=""
                    onclick="closeEditCollectionModal()">Cancel</button>
                <button type="button" class="action-btn" id="save-collection-btn" onclick="dm_saveAnnotation()">Save</button>
            </div>
        </div>
    </div>
</div>

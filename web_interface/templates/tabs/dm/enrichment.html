<!-- Scrape and Annotate sub-page -->
<h2 style="margin: 0 0 16px 0;">
    Scrape and Annotate
    <span class="text-sm" style="color: var(--color-text-tertiary); font-weight: var(--weight-normal); margin-left: 16px;">
        Total: <span id="enrich_total_videos">-</span>
        &middot; Scraped: <span id="enrich_scraped">-</span>
        &middot; Annotated: <span id="enrich_annotated">-</span>
    </span>
</h2>

<!-- Enrichment Header & Study Selection -->
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px;">
    <label class="font-bold" style="color: var(--color-text-tertiary);">Target Study:</label>
    <select id="enrichment-study-select" class="control-input" style="width: 250px;"
        onchange="fetchEnrichmentStats()">
        <option value="">-- Select Study --</option>
        <!-- Populated by JS -->
    </select>
    <button type="button" class="action-btn" id="btn-queue-study"
        onclick="queueVideosFromTargetStudy(this)">Queue videos from target study</button>
    <button type="button" id="btn-queue-voted" class="action-btn"
        onclick="queueVotedVideos(this)">Queue User Voted Videos</button>
</div>

<div style="display: flex; flex-direction: column; gap: 20px;">

    <!-- Scraper Block -->
    <div style="background: var(--section-bg); padding: 20px; border-radius: 4px; border: 1px solid var(--color-border);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="text-body font-bold">Scrape Queue:</span>
                <span id="enrich_scrape_targets"
                    class="font-bold" style="color: var(--color-success-light); margin-left: 5px;">-</span><span>
                    pending</span>
            </div>
            <button type="button" class="btn-stop text-xs" onclick="emptyQueue('scrape')"
                style="padding: 4px 8px;">Empty Queue</button>
        </div>

        <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 12px;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label class="text-xs" style="color: var(--color-text-tertiary);">BATCH SIZE</label>
                <input type="number" id="scrapes-batch-size" value="500"
                    style="width: 70px; background: var(--color-bg-input); border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); padding: 3px;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label class="text-xs" style="color: var(--color-text-tertiary);">MAX BATCHES</label>
                <input type="number" id="scrapes-max-batches" placeholder="Inf"
                    style="width: 70px; background: var(--color-bg-input); border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); padding: 3px;">
            </div>

            <div style="width: 1px; height: 30px; background: var(--color-border);"></div>

            <div class="controls" style="display: flex; gap: 5px; align-items: center;">
                <span id="queue_scraper-status" class="status-indicator status-stopped"></span>
                <button id="queue_scraper-toggle" class="btn-primary" data-start-label="Start Scraper"
                    onclick="startProcess('queue_scraper')" style="padding: 4px 12px;">Start Scraper</button>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="queue_scraper-bar"></div>
            <div class="progress-text" id="queue_scraper-text">Idle</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
            <span id="queue_scraper-last-run" class="text-xs" style="color: var(--color-text-tertiary);"></span>
            <a class="text-xs view-log-link" onclick="openLogModal('queue_scraper', 'Scraper')">View Log</a>
        </div>
    </div>

    <!-- Annotator Block -->
    <div style="background: var(--section-bg); padding: 20px; border-radius: 4px; border: 1px solid var(--color-border);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="text-body font-bold">Annotation Queue:</span>
                <span id="enrich_annotate_targets"
                    class="font-bold" style="color: var(--color-success-light); margin-left: 5px;">-</span><span>
                    pending</span>
            </div>
            <button type="button" class="btn-stop text-xs" onclick="emptyQueue('annotate')"
                style="padding: 4px 8px;">Empty Queue</button>
        </div>

        <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 12px;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label class="text-xs" style="color: var(--color-text-tertiary);">BATCH SIZE</label>
                <input type="number" id="annotations-batch-size" value="500"
                    style="width: 70px; background: var(--color-bg-input); border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); padding: 3px;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <label class="text-xs" style="color: var(--color-text-tertiary);">MAX BATCHES</label>
                <input type="number" id="annotations-max-batches" placeholder="Inf"
                    style="width: 70px; background: var(--color-bg-input); border: 1px solid var(--color-border-strong); color: var(--color-text-secondary); padding: 3px;">
            </div>

            <div style="width: 1px; height: 30px; background: var(--color-border);"></div>

            <div class="controls" style="display: flex; gap: 5px; align-items: center;">
                <span id="queue_annotator-status" class="status-indicator status-stopped"></span>
                <button id="queue_annotator-toggle" class="btn-primary" data-start-label="Start Annotator"
                    onclick="startProcess('queue_annotator')" style="padding: 4px 12px;">Start Annotator</button>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="queue_annotator-bar"></div>
            <div class="progress-text" id="queue_annotator-text">Idle</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
            <span id="queue_annotator-last-run" class="text-xs" style="color: var(--color-text-tertiary);"></span>
            <a class="text-xs view-log-link" onclick="openLogModal('queue_annotator', 'Annotator')">View Log</a>
        </div>
    </div>

</div>
<div style="margin-top: 16px;">
    <div style="display: flex; gap: 12px; align-items: center;">
        <button type="button" class="action-btn" id="btn-consolidate"
            onclick="consolidateEnrichmentData(this)"
            style="padding: 6px 12px;">Consolidate &amp; Refresh</button>
    </div>
    <div id="consolidate-status" class="text-xs" style="margin-top: 6px; color: var(--color-success-light);"></div>
    <div id="consolidate-warning" class="text-xs" style="margin-top: 4px; color: var(--color-warning); display: none;"></div>
    <div id="consolidate-impact" style="display: none; margin-top: 10px; padding: 10px;
         background: var(--section-bg); border: 1px solid var(--color-border); border-radius: 4px;">
        <div class="text-sm font-bold" style="margin-bottom: 6px;">Consolidation Impact</div>
        <div id="impact-details" class="text-xs" style="color: var(--color-text-secondary);"></div>
        <div id="impact-actions" style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
    </div>
</div>

<!-- Ingest Collections sub-page -->
<h2 class="meta-tooltip" data-tooltip="Upload raw collection files or folders, assign collection IDs and tags, then click 'Process New Collections' to parse and merge them into the dataset." style="margin: 0 0 16px 0;">
    Ingest New Collections
    <span class="text-sm" style="color: var(--color-text-tertiary); font-weight: var(--weight-normal); margin-left: 16px;">Unique collections: <span id="ingest-unique-collections-count">-</span></span>
</h2>

<div id="ingestion-sources-container" style="display: flex; gap: 20px; flex-wrap: wrap;">
    <div style="color: var(--color-text-secondary);">Loading registered subclasses...</div>
</div>

<div id="pending-uploads-panel" style="margin-top: 24px; display: none;">
    <div class="text-sm font-semibold" style="margin-bottom: 8px; color: var(--color-text-secondary);">
        Pending uploads
    </div>
    <div id="pending-uploads-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
</div>
<div id="pending-uploads-empty" class="text-sm" style="margin-top: 24px; color: var(--color-text-tertiary); display: none;">
    No new collections to process.
</div>

<div style="margin-top: 16px; display: flex; gap: 8px; align-items: center;">
    <button type="button" class="action-btn" id="processRawFilesBtn"
        onclick="refreshIngestionCollection(this)"
        style="padding: 6px 12px;" disabled>Process New Collections</button>
    <button type="button" class="action-btn" id="clearPendingUploadsBtn"
        onclick="clearPendingUploads(this)"
        style="padding: 6px 12px; display: none;">Cancel All Pending Uploads</button>
</div>

<div id="ingest-results-panel" style="margin-top: 24px; display: none;">
    <div class="text-sm font-semibold" style="margin-bottom: 8px; color: var(--color-text-secondary);">
        Last run results <span id="ingest-results-summary" style="font-weight: var(--weight-normal); color: var(--color-text-tertiary);"></span>
    </div>
    <div id="ingest-results-table-wrap" style="overflow-x: auto;"></div>
</div>

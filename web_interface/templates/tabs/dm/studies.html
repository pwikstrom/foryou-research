<!-- Study Datasets sub-page -->
<h2 style="margin: 0 0 16px 0; display: flex; justify-content: space-between; align-items: center;">
    {% if current_user.is_admin() %}Define Study Datasets{% else %}My Studies{% endif %}
    {% if current_user.is_admin() %}
    <button type="button" class="action-btn" onclick="createNewStudy(); event.stopPropagation();">Define new study</button>
    {% endif %}
</h2>

<div style="overflow-x: auto;">
<table class="collection-table" style="font-variant-numeric: tabular-nums;">
    <thead>
        <tr style="text-align: left;">
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong);">Study Name</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong);">Start Date</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong);">End Date</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong);">Sampling</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); text-align: right;">Collections</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); text-align: right;">Activities</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); text-align: right;">Videos</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); text-align: right;">Scraped</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); text-align: right;">Annotated</th>
            <th style="padding: 8px 5px; position: sticky; top: 0; background: var(--color-border); z-index: 10; border-bottom: 2px solid var(--color-border-strong); min-width: 140px;">Action</th>
        </tr>
    </thead>
    <tbody class="studies-table-body">
        <!-- Rows injected by JS (one per studies-table-body instance) -->
    </tbody>
</table>
</div>

<div id="explore" class="tab-pane">
    <!-- Control Bar -->
    <div class="control-bar" style="margin-right: 20px;">
        <div class="header-with-help" style="margin-right: 20px;">
            <h3>Explore</h3>
            <button class="help-icon" onclick="showHelp('explore')">?</button>
        </div>
        <label for="explorer-v2-study-select" style="margin-right: 10px;">Select
            Study:</label>
        <select id="explorer-v2-study-select" class="dropdown" onchange="changeExplorerV2Study()">
            <option value="" disabled selected>Select a study...</option>
        </select>
        <span id="explorer-v2-file-info" style="display:none;"></span>
    </div>

    <!-- Main Content -->
    <div class="container" style="display: flex; flex-direction: row; height: calc(100vh - 180px); gap: 10px;">

        <!-- Filters Panel Slice 1 (Left) -->
        <div class="panel"
            style="flex: 0 0 300px; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--color-border);">
            <div class="header" style="flex: 0 0 auto; background: var(--color-bg-elevated); padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: baseline; gap: 8px;">
                    <span class="text-sm font-semibold">Filters Slice 1</span>
                    <span id="explorer-v2-count-1" class="text-sm font-semibold"></span>
                </div>
                <button class="btn-save text-xs" style="padding: 2px 8px;"
                    onclick="resetFiltersV2(1)">Reset</button>
            </div>
            <div style="padding: 10px; border-bottom: 1px solid var(--color-border); flex: 0 0 auto;">
                <input type="text" id="explorer-v2-search-input-1" placeholder="Search Slice 1..."
                    style="width: 100%; padding: 8px; border-radius: 4px;">
            </div>
            <div id="explorer-v2-filters-1" style="flex: 1; overflow-y: auto; padding: 10px;">
                <div style="text-align: center; margin-top: 20px; color: var(--color-text-muted);">Loading filters...</div>
            </div>
        </div>

        <!-- Stats Panel (Center) -->
        <div class="panel"
            style="flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--color-bg-primary);">
            <div class="header" style="flex: 0 0 auto; padding: 10px; text-align: center;">
                <div style="display: flex; justify-content: center; align-items: center;">
                    <div id="explorer-v2-slice-toggle" class="toggle-group">
                        <button id="explorer-v2-toggle-single" class="toggle-option active" onclick="setExplorerV2SliceMode(false)">
                            Distribution
                        </button>
                        <button id="explorer-v2-toggle-dual" class="toggle-option" onclick="setExplorerV2SliceMode(true)"
                            title="Compare two filtered groups side by side">
                            ⇄ Compare Slices
                        </button>
                    </div>
                </div>
                <span id="explorer-v2-vs-label" style="display: none;"></span>
                <div style="margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <label for="explorer-v2-sort" class="text-sm font-normal" style="color: var(--color-text-secondary);">Sort by:</label>
                    <select id="explorer-v2-sort" class="dropdown text-sm" onchange="changeExplorerV2Sort(this.value)">
                        <option value="total">Total Frequency</option>
                        <option value="slice1">Slice 1 Frequency</option>
                        <option id="explorer-v2-sort-slice2" value="slice2" style="display: none;">Slice 2 Frequency
                        </option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
            </div>
            <div id="explorer-v2-stats" style="flex: 1; overflow-y: auto; padding: 10px;">
            </div>
        </div>

        <!-- Filters Panel Slice 2 (Right) -->
        <div id="explorer-v2-slice2-panel" class="panel"
            style="flex: 0 0 300px; display: none; flex-direction: column; overflow: hidden; border-left: 1px solid var(--color-border);">
            <div class="header" style="flex: 0 0 auto; background: var(--color-bg-elevated); padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: baseline; gap: 8px;">
                    <span class="text-sm font-semibold">Filters Slice 2</span>
                    <span id="explorer-v2-count-2" class="text-sm font-semibold"></span>
                </div>
                <button class="btn-save text-xs" style="padding: 2px 8px;"
                    onclick="resetFiltersV2(2)">Reset</button>
            </div>
            <div style="padding: 10px; border-bottom: 1px solid var(--color-border); flex: 0 0 auto;">
                <input type="text" id="explorer-v2-search-input-2" placeholder="Search Slice 2..."
                    style="width: 100%; padding: 8px; border-radius: 4px;">
            </div>
            <div id="explorer-v2-filters-2" style="flex: 1; overflow-y: auto; padding: 10px;">
                <div style="text-align: center; margin-top: 20px; color: var(--color-text-muted);">Loading filters...</div>
            </div>
        </div>

    </div>
</div>

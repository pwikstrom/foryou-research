<div id="ingest_ndjson" class="tab-pane">
    <div class="panel" style="max-width: 800px; margin: 0 auto;">
        <div class="header">
            <h2>Ingest Zeeschuimer Logs</h2>
        </div>

        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">

            <!-- Step 1: Select Folder -->
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <!--label style="color: #a0a0a0;">1. Source Folder (defaults to Firefox Downloads)</label>
                <div style="display: flex; gap: 10px;">
                    <div style="display: flex; flex: 1; gap: 5px;">
                        <input type="text" id="ingest-folder-path" placeholder="Path to folder..."
                            style="flex: 1; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 8px;">
                        <button class="btn-secondary" onclick="browseFolder()">Browse...</button>
                    </div>
                    <button class="btn-primary" onclick="findNdjsonFiles()">Find .ndjson Files</button>
                </div-->
                <!-- Step 1: Select Folder -->
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="color: #a0a0a0;">1. Source Folder (defaults to Firefox Downloads)</label>
                    <div style="display: flex; gap: 10px;">
                        <div style="display: flex; flex: 1; gap: 5px;">
                            <input type="text" id="ingest-folder-path" placeholder="Path to folder..."
                                style="flex: 1; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 8px;">
                            <button class="btn-secondary" onclick="browseFolder()">Browse...</button>
                        </div>
                        <button class="btn-primary" onclick="findNdjsonFiles()">Find .ndjson Files</button>
                    </div>

                    <!-- Drop Zone -->
                    <div id="drop-zone"
                        style="border: 2px dashed #444; border-radius: 6px; padding: 60px; text-align: center; color: #888; margin-top: 15px; transition: border-color 0.3s; cursor: pointer; font-size: 1.2em; font-weight: bold;">
                        DRAG & DROP .ndjson FILES HERE
                    </div>
                </div>

                <!-- Step 2: Select Files -->
                <div id="ingest-file-list-container" style="display: none; flex-direction: column; gap: 5px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="color: #a0a0a0;">2. Select Files to Ingest</label>
                        <label style="font-size: 0.9em; cursor: pointer;">
                            <input type="checkbox" id="ingest-select-all" onchange="toggleSelectAllFiles(this)"> Select
                            All
                        </label>
                    </div>
                    <div id="ingest-file-list"
                        style="max-height: 300px; overflow-y: auto; border: 1px solid #3e3e42; background: #252526; padding: 10px; border-radius: 4px;">
                        <!-- File items will be injected here -->
                    </div>
                </div>

                <!-- Step 3: Label and Ingest -->
                <div id="ingest-action-container" style="display: none; flex-direction: column; gap: 5px;">
                    <label style="color: #a0a0a0;">3. Assign Label & Process</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="ingest-label" placeholder="Enter Label (e.g. MyStudy_Data)"
                            style="flex: 1; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 8px;">
                        <button class="btn-start" onclick="ingestSelectedFiles()" id="btn-ingest">Ingest
                            Selected</button>
                    </div>
                    <p style="font-size: 0.8em; color: #888; margin-top: 5px;">
                        Files will be moved to <code>zeeschuimer_raw</code>, processed, and saved to
                        <code>zeeschuimer_refined</code> as pickle files.
                    </p>
                </div>

                <!-- Status Log -->
                <!-- Summary & Status -->
                <div id="ingest-results-container"
                    style="display: none; flex-direction: column; gap: 10px; margin-top: 20px;">
                    <label style="color: #a0a0a0;">Ingestion Results</label>
                    <div id="ingest-summary"
                        style="white-space: pre-wrap; font-family: monospace; background: #1e1e1e; padding: 15px; border: 1px solid #4caf50; border-radius: 4px; color: #e0faea;">
                    </div>

                    <div style="font-size: 0.9em;">
                        <a href="#" onclick="toggleIngestLogs(event)"
                            style="color: #64b5f6; text-decoration: none;">Show/Hide Detailed Logs</a>
                    </div>
                    <div class="log-window" id="ingest-logs" style="height: 150px; display: none;">Logs will appear
                        here...
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let foundFiles = [];



        async function browseFolder() {
            const btn = document.querySelector('button[onclick="browseFolder()"]');
            const originalText = btn.innerText;
            btn.innerText = "...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/browse_folder', { method: 'POST' });
                const data = await response.json();

                if (response.ok && data.path) {
                    document.getElementById('ingest-folder-path').value = data.path;
                } else if (data.error && data.error !== 'Selection cancelled') {
                    // Ignore cancel, alert other errors
                    alert("Error: " + data.error);
                }
            } catch (e) {
                alert("Network error: " + e);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function findNdjsonFiles() {
            const folderPath = document.getElementById('ingest-folder-path').value;
            const btn = document.querySelector('button[onclick="findNdjsonFiles()"]');
            const originalText = btn.innerText;
            btn.innerText = "Searching...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/find_ndjson', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ directory: folderPath })
                });

                const data = await response.json();

                if (response.ok) {
                    foundFiles = data.files;
                    renderFileList();
                    document.getElementById('ingest-file-list-container').style.display = 'flex';
                    document.getElementById('ingest-action-container').style.display = 'flex';

                    // If path was empty and backend used default, update input
                    if (!folderPath && data.directory) {
                        document.getElementById('ingest-folder-path').value = data.directory;
                    }
                } else {
                    alert("Error: " + data.message);
                }
            } catch (e) {
                alert("Network error: " + e);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function renderFileList() {
            const container = document.getElementById('ingest-file-list');
            container.innerHTML = '';

            if (foundFiles.length === 0) {
                container.innerHTML = '<div style="padding: 10px; color: #888;">No .ndjson files found in this directory.</div>';
                return;
            }

            foundFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.alignItems = 'center';
                item.style.padding = '5px 0';
                item.style.borderBottom = '1px solid #333';

                item.innerHTML = `
                <input type="checkbox" class="ingest-file-checkbox" id="file-${index}" data-index="${index}" style="margin-right: 10px;">
                <div style="flex: 1;">
                    <div style="font-weight: bold;">${file.filename}</div>
                    <div style="font-size: 0.8em; color: #888;">${file.modified}</div>
                </div>
            `;
                container.appendChild(item);
            });
        }

        function toggleSelectAllFiles(source) {
            document.querySelectorAll('.ingest-file-checkbox').forEach(cb => {
                cb.checked = source.checked;
            });
        }

        async function ingestSelectedFiles() {
            const label = document.getElementById('ingest-label').value.trim();
            if (!label) {
                alert("Please provide a label.");
                return;
            }

            const selectedIndices = Array.from(document.querySelectorAll('.ingest-file-checkbox:checked'))
                .map(cb => parseInt(cb.getAttribute('data-index')));

            if (selectedIndices.length === 0) {
                alert("Please select at least one file.");
                return;
            }

            const selectedFiles = selectedIndices.map(i => foundFiles[i].path);

            const btn = document.getElementById('btn-ingest');
            btn.disabled = true;
            btn.innerText = "Processing...";

            const logsDiv = document.getElementById('ingest-logs');
            const summaryDiv = document.getElementById('ingest-summary');
            const resultsContainer = document.getElementById('ingest-results-container');

            resultsContainer.style.display = 'flex';
            logsDiv.style.display = 'none'; // Hide logs initially
            logsDiv.innerText = "Starting ingestion...\n";
            summaryDiv.innerText = "Processing...";

            try {
                const response = await fetch('/api/ingest_ndjson', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        files: selectedFiles,
                        label: label
                    })
                });

                const result = await response.json();

                logsDiv.innerText += result.log + "\n";
                logsDiv.innerText += result.message + "\n";
                logsDiv.scrollTop = logsDiv.scrollHeight;

                if (result.summary) {
                    summaryDiv.innerText = result.summary;
                } else {
                    summaryDiv.innerText = result.message;
                }
                logsDiv.scrollTop = logsDiv.scrollHeight;

                if (result.status === 'success') {
                    // Refresh list to show they are gone (moved)
                    findNdjsonFiles();
                }

            } catch (e) {
                logsDiv.innerText += "Error: " + e + "\n";
            } finally {
                btn.disabled = false;
                btn.innerText = "Ingest Selected";
            }
        }


        function toggleIngestLogs(e) {
            e.preventDefault();
            const logsDiv = document.getElementById('ingest-logs');
            if (logsDiv.style.display === 'none') {
                logsDiv.style.display = 'block';
            } else {
                logsDiv.style.display = 'none';
            }
        }

        // Drag and Drop Logic
        const dropZone = document.getElementById('drop-zone');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.style.borderColor = '#64b5f6';
            dropZone.style.color = '#fff';
            dropZone.style.backgroundColor = 'rgba(100, 181, 246, 0.1)';
        }

        function unhighlight(e) {
            dropZone.style.borderColor = '#444';
            dropZone.style.color = '#888';
            dropZone.style.backgroundColor = 'transparent';
        }

        dropZone.addEventListener('drop', handleDrop, false);

        async function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        }

        async function handleFiles(files) {
            dropZone.innerText = `Uploading ${files.length} files...`;

            for (let i = 0; i < files.length; i++) {
                await uploadFile(files[i]);
            }

            dropZone.innerText = "DRAG & DROP .ndjson FILES HERE";

            // Show the list if we found any valid files
            renderFileList();
            if (foundFiles.length > 0) {
                document.getElementById('ingest-file-list-container').style.display = 'flex';
                document.getElementById('ingest-action-container').style.display = 'flex';
            }
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload_ndjson', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    // Add to foundFiles list
                    foundFiles.push({
                        filename: data.filename,
                        path: data.path, // The server temp path
                        modified: "Just now (" + data.modified + ")"
                    });
                } else {
                    console.error("Upload failed for " + file.name + ": " + data.error);
                    alert("Upload failed for " + file.name + ": " + data.error);
                }
            } catch (e) {
                console.error("Network error uploading " + file.name, e);
            }
        }

    </script>
</div> <!-- Closing #ingest_ndjson -->

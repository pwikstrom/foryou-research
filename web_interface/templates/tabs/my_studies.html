<div id="my_studies" class="tab-pane" style="overflow-y: auto; padding: 20px;">
    <div style="max-width: 1200px;">
        {% include 'tabs/dm/studies.html' %}
    </div>

    <!-- New Study Modal -->
    <div id="newStudyModal" class="modal"
        style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: var(--color-bg-overlay);">
        <div class="modal-content"
            style="width: 50%;">
            <span class="close text-h2 font-bold" onclick="closeNewStudyModal()"
                style="color: var(--color-text-tertiary); float: right; cursor: pointer;">&times;</span>
            <h2>Define New Study</h2>
            <div class="form-group">
                <label>Study Name (Unique):</label>
                <input type="text" id="new_study_name" class="control-input" style="width: 100%;">
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button type="button" class="action-btn" onclick="createStudy(event)">Create</button>
            </div>
        </div>
    </div>

    <!-- Template for Row Details (Hidden) -->
    <template id="study_detail_template">
        <tr class="detail-row" style="background-color: var(--color-bg-elevated); display: none;">
            <td colspan="10" style="padding: 30px;">
                <div class="study-form" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px;">
                    <!-- Column 1 -->
                    <div>
                        <div class="form-group-row">
                            <label class="meta-tooltip" data-tooltip="yyyy-mm-dd — only include events after this date">Start Date</label>
                            <input type="text" data-field="START_DATE" class="control-input" {% if not
                                current_user.is_admin() %}disabled{% endif %}>
                        </div>
                        <div class="form-group-row">
                            <label class="meta-tooltip" data-tooltip="yyyy-mm-dd — only include events before this date">End Date</label>
                            <input type="text" data-field="END_DATE" class="control-input" {% if not
                                current_user.is_admin() %}disabled{% endif %}>
                        </div>
                    </div>
                    <!-- Column 2 -->
                    <div>
                        <div class="form-group-row" style="align-items: flex-start; flex-direction: column;">
                            <label class="meta-tooltip" data-tooltip="Control which user roles can access this study" style="margin-bottom: 8px;">User Access</label>
                            <div class="checkbox-group" data-field-group="USER_ACCESS"
                                style="text-align: left; {% if not current_user.is_admin() %}pointer-events: none; opacity: 0.6;{% endif %}">
                                <div class="dynamic-roles-container">Loading roles...</div>
                            </div>
                        </div>
                    </div>
                    <!-- Column 3 -->
                    <div>
                        <div class="form-group-row">
                            <label class="meta-tooltip"
                                data-tooltip="Control if and how collections are sampled: off, events, scraped, annotated">Collection Sample Frame</label>
                            <select data-field="DONATION_SAMPLE_FRAME" class="control-input"
                                onchange="toggleSamplingOptions(this)" {% if not current_user.is_admin() %}disabled{%
                                endif %}>
                                <option value="off">off</option>
                                <option value="events">events</option>
                                <option value="scraped">scraped</option>
                                <option value="annotated">annotated</option>
                            </select>
                        </div>

                        <div id="sampling-options-container">
                            <div class="form-group-row">
                                <label class="meta-tooltip"
                                    data-tooltip="Groups with fewer than this number of events are excluded (default: 10)">Min Event Count</label>
                                <input type="number" data-field="MIN_EVENT_COUNT_REQUIRED_PER_AGG_GROUP"
                                    class="control-input" {% if not current_user.is_admin() %}disabled{% endif %}>
                            </div>
                            <div class="form-group-row">
                                <label class="meta-tooltip"
                                    data-tooltip="Groups with more than this number of events are downsampled (default: 100)">Max Event Count</label>
                                <input type="number" data-field="MAX_EVENT_COUNT_SELECTED_PER_AGG_GROUP"
                                    class="control-input" {% if not current_user.is_admin() %}disabled{% endif %}>
                            </div>
                            <div class="form-group-row">
                                <label class="meta-tooltip"
                                    data-tooltip="Collections with fewer than this number of accepted groups are excluded (default: 10)">Min Group Count</label>
                                <input type="number" data-field="MIN_GROUP_COUNT_REQUIRED_PER_DONATION"
                                    class="control-input" {% if not current_user.is_admin() %}disabled{% endif %}>
                            </div>
                            <div class="form-group-row">
                                <label class="meta-tooltip"
                                    data-tooltip="Collections with more than this number of accepted groups are downsampled (default: 100)">Max Group Count</label>
                                <input type="number" data-field="MAX_GROUP_COUNT_SELECTED_PER_DONATION"
                                    class="control-input" {% if not current_user.is_admin() %}disabled{% endif %}>
                            </div>
                        </div>
                    </div>
                </div>
                {% if current_user.is_admin() %}
                <div class="form-group" style="margin-top: 20px;">
                    <label class="meta-tooltip" data-tooltip="List of specific collection IDs to include. Leave empty for all."
                        style="display: block; margin-bottom: 8px;">Selected Collections</label>

                    <div class="collection-selector" style="border: 1px solid var(--color-border-strong); padding: 10px; background: var(--color-border);">
                        <div
                            style="display: flex; gap: 15px; margin-bottom: 10px; align-items: center; justify-content: space-between;">
                            <input type="text" placeholder="Search collections by ID or metadata..."
                                class="control-input collection-search-input" style="width: 300px;"
                                onkeyup="filterCollections(this)" {% if not current_user.is_admin() %}disabled{% endif
                                %}>
                            <div class="text-sm"
                                style="display: flex; gap: 15px; flex: 1; margin-left: 10px; color: var(--color-text-secondary); align-items: center; flex-wrap: wrap;">
                                <span>Collections: <strong class="selected-count">0</strong></span>
                                <span>Events: <strong class="selected-events-count">0</strong></span>
                                <div
                                    style="display: flex; gap: 15px; align-items: center; border-left: 1px solid var(--color-border-strong); padding-left: 15px;">
                                    <input type="hidden" data-field="stats" value="{}">
                                    <button type="button" class="text-xs" onclick="updateStudyEstimates(this, event)"
                                        style="padding: 2px 5px; cursor: pointer; background: var(--btn-discreet-bg); border: 1px solid var(--btn-discreet-border); color: var(--btn-discreet-text); border-radius: 3px;"
                                        {% if not current_user.is_admin() %}disabled{% endif %}>Update
                                        Estimates</button>
                                    <span>Filtered/sampled Unique vids: <strong class="stat-unique-vids"
                                            style="color: var(--color-text-primary);">-</strong></span>
                                    <span>Scraped: <strong class="stat-scraped-vids"
                                            style="color: var(--color-text-primary);">-</strong></span>
                                    <span>Annotated: <strong class="stat-annotated-vids"
                                            style="color: var(--color-text-primary);">-</strong></span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button type="button" onclick="selectAllCollections(this, true)"
                                    style="padding: 5px 10px;" {% if not current_user.is_admin() %}disabled{% endif
                                    %}>All</button>
                                <button type="button" onclick="selectAllCollections(this, false)"
                                    style="padding: 5px 10px;" {% if not current_user.is_admin() %}disabled{% endif
                                    %}>None</button>
                            </div>
                        </div>
                        <div class="collection-checklist-container"
                            style="max-height: 200px; overflow-y: auto; text-align: left; background: var(--color-bg-elevated); padding: 5px; border: 1px solid var(--color-border-strong);">
                            <!-- Checkboxes injected by JS -->
                            <div style="padding: 10px; color: var(--color-text-secondary);">Loading collections...</div>
                        </div>
                    </div>
                </div>
                <!-- Hidden input to maintain compatibility if needed, or we just handle in JS -->
                <input type="hidden" data-field="SELECTED_DONATIONS" value="[]">
                {% endif %}

                <style>
                    /* Scoped styles for this template's use */
                    .form-group-row {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 20px;
                    }

                    .form-group-row label {
                        flex: 1;
                        text-align: left;
                        margin-right: 15px;
                        color: var(--color-text-secondary);
                    }

                    .form-group-row .control-input {
                        flex: 1;
                        max-width: 50%;
                        text-align: right;
                    }
                </style>

                {% if current_user.is_admin() %}
                <div style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
                    <button type="button" class="action-btn" onclick="saveStudy(this, event)">Save Study
                        Definition</button>
                    <button type="button" class="btn-danger" onclick="deleteStudy(this, event)">Delete
                        Study</button>
                </div>
                {% endif %}
            </td>
        </tr>
    </template>
</div>

<script src="/static/js/data_management.js"></script>

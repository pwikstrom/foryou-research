<div id="scrape_annotate" class="tab-pane">
    <!-- Global Control Bar -->
    <div class="panel"
        style="margin-bottom: 20px; display: flex; flex-direction: row; align-items: center; gap: 20px; padding: 5px 15px; width: auto; flex: 0 0 auto;">
        <select id="global-study-name"
            style="width: 25ch; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 5px;">
            <option value="" disabled selected>Select Study</option>
        </select>


        <div style="width: 1px; height: 20px; background: #3e3e42; margin: 0 10px;"></div>

        <div style="display: flex; flex-direction: column; gap: 2px;">
            <label style="font-size: 0.8em; color: #a0a0a0;">Batch Size</label>
            <input type="number" id="global-batch-size" value="500"
                style="width: 80px; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 3px;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px;">
            <label style="font-size: 0.8em; color: #a0a0a0;">Max Batches</label>
            <input type="number" id="global-max-batches" placeholder="Inf"
                style="width: 80px; border: 1px solid #3e3e42; background: #3c3c3c; color: #d4d4d4; padding: 3px;">
        </div>

        <div style="width: 1px; height: 20px; background: #3e3e42; margin: 0 10px;"></div>

        <button class="btn-primary" onclick="checkVideoCounts()" style="font-size: 0.8em; padding: 4px 10px;">Check
            counts</button>
        <span id="video-counts-display" style="font-size: 0.85em; color: #d4d4d4; margin-left: 5px;"></span>

    </div>

    <div class="container" style="flex-direction: row; gap: 20px;">

        <!-- Left Column -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
            <!-- Downloader Panel -->
            <div class="panel" style="flex: 1;">
                <div class="header">
                    <h2>Scraper Loop</h2>
                    <div class="controls">
                        <span id="downloader-status" class="status-indicator status-stopped"></span>
                        <button class="btn-start" onclick="startProcess('downloader')">Start</button>
                        <button class="btn-stop" onclick="stopProcess('downloader')">Stop</button>
                        <button class="btn-save" style="background: #555; font-size: 0.8em;"
                            onclick="clearLogs('downloader')">Clear</button>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="downloader-bar"></div>
                    <div class="progress-text" id="downloader-text">Idle</div>
                </div>
                <div class="log-window" id="downloader-logs">Logs will appear here...</div>
            </div>

            <!-- Monitor Panel -->
            <div class="panel" style="flex: 1;">
                <div class="header">
                    <h2>Monitor Scrapes & Auto Annotate</h2>
                    <label
                        style="font-size: 0.8em; display: flex; align-items: center; cursor: pointer; margin-left: auto; margin-right: 15px; color: #a0a0a0;">
                        <input type="checkbox" id="monitor-auto-start" checked style="margin-right: 5px;"> Auto start
                    </label>
                    <div class="controls">
                        <span id="monitor-status" class="status-indicator status-stopped"></span>
                        <button class="btn-start" onclick="startProcess('monitor')">Start</button>
                        <button class="btn-stop" onclick="stopProcess('monitor')">Stop</button>
                        <button class="btn-save" style="background: #555; font-size: 0.8em;"
                            onclick="clearLogs('monitor')">Clear</button>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="monitor-bar"></div>
                    <div class="progress-text" id="monitor-text">Idle</div>
                </div>
                <div class="log-window" id="monitor-logs">Logs will appear here...</div>
            </div>
        </div>

        <!-- Right Column: Annotator Panel -->
        <div class="panel" style="flex: 1; height: auto;">
            <div class="header">
                <h2>Annotator Loop</h2>
                <div class="controls">
                    <span id="annotator-status" class="status-indicator status-stopped"></span>
                    <button class="btn-start" onclick="startProcess('annotator')">Start</button>
                    <button class="btn-stop" onclick="stopProcess('annotator')">Stop</button>
                    <button class="btn-save" style="background: #555; font-size: 0.8em;"
                        onclick="clearLogs('annotator')">Clear</button>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="annotator-bar"></div>
                <div class="progress-text" id="annotator-text">Idle</div>
            </div>
            <div class="log-window" id="annotator-logs">Logs will appear here...</div>
        </div>

    </div>
</div> <!-- End of Scrape & Annotate Tab -->

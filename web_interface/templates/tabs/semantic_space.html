<div id="semantic_space" class="tab-pane">
    <div class="control-bar">
        <span id="ss-status" class="text-sm" style="color: var(--control-bar-info);">Loading map…</span>
    </div>

    <!-- Freshness banner: shown when the embedding store is being topped up, the
         visible map is behind the corpus, a rebuild is running, or a fresher map
         is ready. The map below keeps rendering throughout. -->
    <div id="ss-banner" class="text-sm" style="display: none; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 4px; margin-bottom: 10px; background: var(--color-bg-elevated); border: 1px solid var(--color-border);">
        <span id="ss-banner-text" style="color: var(--color-text-secondary);"></span>
        <button id="ss-banner-action" class="action-btn text-xs" style="display: none; margin-left: auto;"></button>
    </div>

    <div class="panel" style="display: flex; flex-direction: column; height: calc(100vh - 150px); padding: 0;">
        <!-- Controls -->
        <div style="padding: 10px 14px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-elevated); display: flex; gap: 18px; align-items: center; flex-wrap: wrap;">
            <label class="text-sm" style="display: flex; align-items: center; gap: 6px;">
                <span class="font-medium" style="color: var(--color-text-secondary);">Colour by</span>
                <select id="ss-color-mode" class="dropdown">
                    <option value="niche">Niche</option>
                    <option value="category">Content category</option>
                    <option value="popularity">Popularity (plays)</option>
                </select>
            </label>

            <label class="text-sm" style="display: flex; align-items: center; gap: 6px;">
                <span class="font-medium" style="color: var(--color-text-secondary);">Focus niche</span>
                <select id="ss-niche-focus" class="dropdown">
                    <option value="">— all niches —</option>
                </select>
            </label>

            <label class="text-sm" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="ss-show-labels" checked>
                <span style="color: var(--color-text-secondary);">Niche labels</span>
            </label>

            <!-- Divider between map controls and the collection-trajectory overlay. -->
            <span style="align-self: stretch; width: 1px; background: var(--color-border-subtle);"></span>

            <label class="text-sm" style="display: flex; align-items: center; gap: 6px;">
                <span class="font-medium" style="color: var(--color-text-secondary);">Collection</span>
                <select id="ss-collection" class="dropdown">
                    <option value="">— select collection —</option>
                </select>
            </label>

            <label class="text-sm" style="display: flex; align-items: center; gap: 6px;">
                <span class="font-medium" style="color: var(--color-text-secondary);">Interval</span>
                <select id="ss-traj-interval" class="dropdown">
                    <option value="month">Monthly</option>
                    <option value="week">Weekly</option>
                    <option value="day">Daily</option>
                    <option value="all">All-time only</option>
                </select>
            </label>

            <label class="text-sm" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="ss-show-trajectory">
                <span style="color: var(--color-text-secondary);">Show trajectory</span>
            </label>

            <button id="ss-anim-play" class="action-btn text-xs" type="button" style="min-width: 64px;">▶ Play</button>

            <input type="range" id="ss-scrub" min="0" max="0" step="any" value="0" disabled
                   title="Scrub through the collection's periods"
                   style="width: 160px; vertical-align: middle;">

            <span id="ss-traj-status" class="text-sm" style="color: var(--control-bar-info);"></span>
        </div>

        <!-- Niche detail bar: what defines the focused niche — its size,
             typicality, genuinely nearest niches, distinctive terms and
             category shares. Fixed height for the same reason as the legend
             below: the plot box must stay constant, or the 1:1-locked scatter
             shifts every time a niche is focused or cleared. Items wrap onto a
             second row (flex-wrap) while each item stays on one line
             and long lists wrap inside their own item rather than being clipped
             (no white-space: nowrap — a nowrap list of niche names is wider
             than the pane). Three rows fit the longest realistic content;
             align-content centres them, so a shorter bar reads as padding
             rather than a gap. -->
        <div id="ss-niche-info" class="text-xs"
             style="height: 76px; box-sizing: border-box; padding: 0 14px;
                    border-bottom: 1px solid var(--color-border-subtle);
                    background: var(--color-bg-elevated); color: var(--control-bar-info);
                    display: flex; flex-wrap: wrap; align-items: center;
                    align-content: center; gap: 2px 16px;
                    overflow-x: hidden; overflow-y: auto;"></div>

        <!-- Plot -->
        <div id="semantic-space-plot" style="flex: 1; min-height: 0;"></div>

        <!-- Colour legend — rendered as HTML below the plot, deliberately kept
             out of the Plotly figure. An in-figure colourbar would resize the
             plot box and (via the 1:1 aspect lock) shift the scatter when the
             colour scale changes; an HTML legend never touches the plot box.
             Fixed height (so the plot box stays constant for every variable,
             whatever the legend's content); scrolls if a categorical variable
             has more swatches than fit. Shows category swatches or a numeric
             gradient bar. -->
        <div id="ss-legend" class="text-xs" style="height: 56px; box-sizing: border-box; padding: 8px 14px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-elevated); color: var(--control-bar-info); display: flex; align-items: center; align-content: flex-start; gap: 4px 12px; flex-wrap: wrap; overflow-y: auto;"></div>
    </div>
</div>

<div id="sessions" class="tab-pane">
    <div class="control-bar">
        <span id="sess-status" class="text-sm" style="color: var(--control-bar-info);">Loading sessions…</span>
    </div>

    <!-- Freshness banner: artifact missing / rebuild running / model mismatch. -->
    <div id="sess-banner" class="text-sm" style="display: none; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 4px; margin-bottom: 10px; background: var(--color-bg-elevated); border: 1px solid var(--color-border);">
        <span id="sess-banner-text" style="color: var(--color-text-secondary);"></span>
    </div>

    <!-- flex:1 + min-height:0, not a calc(100vh - Npx) guess: the shell never
         scrolls (body and .tab-content are overflow:hidden), so a row taller
         than the space left under the header/nav/control bar has its bottom
         CLIPPED — which is where the table's pagination footer lives. -->
    <div style="display: flex; gap: 16px; align-items: stretch; flex: 1; min-height: 0;">

        <!-- Left rail: session table (sort by clicking column headings) -->
        <div class="panel" style="width: 460px; min-width: 380px; display: flex; flex-direction: column; padding: 0;">
            <!-- Collapsible range-filter panel; slider rows are built by
                 sessRenderFilters() from the overview's `ranges` bounds. -->
            <div id="sess-filters" class="sess-filters">
                <div class="sess-filters-head">
                    <button type="button" id="sess-filters-toggle" class="sess-filters-toggle text-xs font-medium">
                        <span id="sess-filters-caret" class="sess-filters-caret">▾</span>
                        Filters
                        <span id="sess-filters-badge" class="sess-badge text-xxs" style="display: none;"></span>
                    </button>
                    <button type="button" id="sess-filters-clear" class="btn-discreet text-xxs" style="display: none; padding: 1px 8px;">Clear</button>
                </div>
                <div id="sess-filters-body" class="sess-filters-body"></div>
            </div>
            <div id="sess-list-summary" class="text-xs" style="padding: 6px 14px; color: var(--color-text-tertiary); border-bottom: 1px solid var(--color-border-subtle);"></div>
            <div id="sess-list" style="flex: 1; overflow-y: auto;"></div>
            <div id="sess-pager" class="sess-pager" style="display: none;">
                <button type="button" id="sess-page-prev" class="btn-discreet text-xs">◀ Prev</button>
                <span id="sess-page-info" class="text-xs" style="color: var(--color-text-tertiary);"></span>
                <button type="button" id="sess-page-next" class="btn-discreet text-xs">Next ▶</button>
            </div>
        </div>

        <!-- Main: selected session detail -->
        <div class="panel" style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0; overflow-y: auto;">
            <div id="sess-detail-empty" class="text-sm" style="padding: 40px; color: var(--color-text-muted);">
                Select a session on the left to inspect its play-by-play sequence and focus episodes.
            </div>
            <div id="sess-detail" style="display: none; flex-direction: column; gap: 14px; padding: 14px;">
                <div id="sess-detail-header"></div>
                <div>
                    <div class="text-sm font-medium" style="color: var(--color-text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
                        Session strip
                        <span class="meta-tooltip text-xs" data-tooltip="A real-time axis across the session: each mark starts where its play started, and its WIDTH is how long that video was watched — so an unbroken run of watching fills the strip, and gaps are pauses. Height is constant. Coloured marks (and the outlined bands behind them) are detected binges; grey marks are plays whose video has no embedding."
                              style="color: var(--color-text-muted); cursor: help;">ⓘ</span>
                    </div>
                    <div id="sess-strip" style="position: relative;"></div>
                </div>
                <!-- Sequence selector column + shared single-video player -->
                <div style="display: flex; gap: 14px; align-items: stretch; min-height: 0;">
                    <div class="sess-seq-list" style="width: 300px; min-width: 250px; display: flex; flex-direction: column; gap: 6px;">
                        <div class="text-sm font-medium" style="color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px;">
                            Binges
                            <!-- data-tooltip is rewritten from the artifact's real
                                 [sessions] limits by sessApplyParamCopy(). -->
                            <span id="sess-binge-help" class="meta-tooltip text-xs" data-tooltip="A binge is a maximal run of distinct videos within the session where each next video stays semantically close to the running centre of the previous ones."
                                  style="color: var(--color-text-muted); cursor: help;">ⓘ</span>
                        </div>
                        <div id="sess-episode-chips" style="display: flex; flex-direction: column; gap: 6px;"></div>
                        <div class="text-sm font-medium" style="color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; margin-top: 8px;">
                            Low-entropy sequences
                            <span id="sess-seq-help" class="meta-tooltip text-xs" data-tooltip="The session's most semantically homogeneous stretches: up to 3 non-overlapping windows of 6 consecutive distinct embedded videos, ranked by the average pairwise distance between their content embeddings (the best one is the session's score in the table). Because all windows are the same size, their spectral entropy is directly comparable — 'low entropy' means the content spans few independent semantic directions. Found by exhaustive search, independent of the binge detector, so they can confirm a binge or reveal a focused stretch it missed."
                                  style="color: var(--color-text-muted); cursor: help;">ⓘ</span>
                        </div>
                        <div id="sess-window-chips" style="display: flex; flex-direction: column; gap: 6px;"></div>
                    </div>
                    <div id="sess-player-pane" class="sess-player-pane" style="flex: 1; min-width: 0;"></div>
                </div>
                <div>
                    <div class="text-sm font-medium" style="color: var(--color-text-secondary); margin-bottom: 6px; display: flex; align-items: center; gap: 10px;">
                        Full play sequence
                        <button id="sess-playlist-toggle" class="btn-discreet text-xs" style="padding: 2px 8px;">Show</button>
                    </div>
                    <div id="sess-playlist" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shared JS-positioned tooltip for the SVG strip -->
    <div id="sess-strip-tooltip" class="text-xs" style="display: none; position: fixed; z-index: 1000; max-width: 320px; padding: 6px 9px; border-radius: 4px; background: var(--color-bg-elevated); border: 1px solid var(--color-border); color: var(--color-text-primary); pointer-events: none; box-shadow: var(--shadow-md);"></div>
</div>

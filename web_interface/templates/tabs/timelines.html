<div id="timelines" class="tab-pane">

    <!-- Control Bar -->
    <div class="control-bar">
        <label for="timelines-collection-select" style="margin-right: 10px;">Collection:</label>
        <select id="timelines-collection-select" class="dropdown" style="max-width: 180px;" onchange="timelines.onCollectionChange()">
            <option value="" disabled selected>Loading collections...</option>
        </select>

        <!-- Tag chips next to dropdown -->
        <span id="timelines-tag-chips" class="text-xxs" style="margin-left: 10px; display: flex; align-items: center; gap: 5px;"></span>

        <!-- Info icon with hover tooltip -->
        <div id="timelines-header" class="timelines-info-icon-wrapper" style="display: none; position: relative; margin-left: 6px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer; vertical-align: middle;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <div id="timelines-info-tooltip" class="timelines-info-tooltip">
                <div id="timelines-participant-info-section" class="stats-section" style="margin-top: 0;">
                    <ul class="stats-list">
                        <li><span class="stat-label">Age:</span> <span id="timelines-stat-age"></span></li>
                        <li><span class="stat-label">Country:</span> <span id="timelines-stat-country"></span></li>
                        <li><span class="stat-label">Post Code:</span> <span id="timelines-stat-postcode"></span></li>
                        <li><span class="stat-label">Date Added:</span> <span id="timelines-stat-collection-date"></span></li>
                        <li><span class="stat-label">Display ID:</span> <span id="timelines-stat-display-id"></span></li>
                        <li><span class="stat-label">TZ (inferred):</span> <span id="timelines-stat-timezone"></span></li>
                        <li><span class="stat-label">Active Days:</span> <span id="timelines-stat-active-days"></span></li>
                        <li><span class="stat-label">Total Activities:</span> <span id="timelines-stat-total-events"></span></li>
                        <li><span class="stat-label">Peak Day Segment:</span> <span id="timelines-stat-peak-segment"></span></li>
                        <li><span class="stat-label">First main activity:</span> <span id="timelines-stat-first-event"></span></li>
                        <li><span class="stat-label">Last activity:</span> <span id="timelines-stat-last-event"></span></li>
                        <li><span class="stat-label">Tags:</span> <span id="timelines-stat-tags"></span></li>
                    </ul>
                </div>
            </div>
        </div>

        <span id="timelines-collection-count" class="text-sm" style="display: none;"></span>

        <!-- Right-aligned controls -->
        <div style="margin-left: auto; display: flex; align-items: center; gap: 20px;">
            <label class="text-xs meta-tooltip tooltip-below tooltip-right-anchored" style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--color-text-muted);"
                   data-tooltip="Overlay raw daily values as low-opacity bars behind the smoothed line, so you can see which day drove any bump you notice.">
                <input type="checkbox" id="timelines-show-raw" onchange="timelines.toggleShowRaw(this.checked)" style="margin: 0; cursor: pointer;">
                Show daily values
            </label>
        </div>
    </div>

    <!-- Main Content (full width, no sidebar) -->
    <div class="timelines-main" style="padding: 0 20px; overflow-y: auto; height: calc(100vh - 160px);">

        <div id="timelines-charts-container">
            <p class="text-muted" style="margin-top: 50px; text-align: center;">Select a collection to view
                timelines.
            </p>
        </div>

        <!-- Timeline Stats Modal -->
        <div id="timeline-stats-modal" class="modal"
            onclick="document.getElementById('timeline-stats-modal').style.display='none'">
            <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 560px; font-size: var(--text-sm);">
                <span class="close"
                    onclick="document.getElementById('timeline-stats-modal').style.display='none'">&times;</span>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-right: 30px; gap: 10px;">
                    <h3 id="timeline-stats-title" class="text-body font-semibold" style="margin: 0; color: var(--color-text-primary);">Period Stats</h3>
                    <div style="display: flex; gap: 6px; flex-shrink: 0;">
                        <button id="timeline-view-videos-btn" class="btn-discreet" style="font-size: var(--text-xs);"
                            onclick="window.timelines.viewInVideoAnalysis()">
                            View videos
                        </button>
                        <button id="timeline-vote-btn" class="btn-discreet" style="font-size: var(--text-xs); display: none;"
                            onclick="window.timelines.voteMachineAnnotation()">
                            Vote to annotate
                        </button>
                    </div>
                </div>
                <div id="timeline-stats-content" style="max-height: 60vh; overflow-y: auto;">
                    <p class="text-sm" style="color: var(--color-text-secondary);">Loading stats...</p>
                </div>
            </div>
        </div>

    </div>

</div>

<div id="video_analysis" class="tab-pane">

    <!-- Control Bar -->
    <div class="control-bar">
        <!-- Left panel toggle -->
        <button id="va-left-toggle" onclick="window.vaToggleLeft()" class="meta-tooltip tooltip-below desktop-only-toggle" data-tooltip="Toggle filters panel"
            style="background:none; border:none; cursor:pointer; padding:4px; margin-right:10px; display:flex; align-items:center; transition: background 0.15s; border-radius: 4px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--control-bar-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>
        <button class="mobile-only mobile-drawer-trigger" data-drawer-target="#va-left-panel"
            style="margin-right: 10px;">Filters</button>
        <span class="text-sm" style="margin-right: 8px; color: var(--control-bar-text);">Date range:</span>
        <span id="viewer-date-range" class="text-sm meta-tooltip"
            data-tooltip="First and last activity timestamp in the current selection (UTC). Videos are sorted oldest to newest."
            style="color: var(--control-bar-info);">&mdash;</span>

        <span id="viewer-file-info" class="text-sm" style="margin-left: 20px; color: var(--control-bar-info);"></span>

        <!-- Hide Duplicates + right panel toggle + help -->
        <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
            <label class="switch" style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="viewer-hide-duplicates" onchange="applyViewerFilters()">
                <span class="font-bold" style="color: var(--control-bar-text); margin-left: 5px;">Hide Duplicate Videos</span>
            </label>
            <!-- Right panel toggle -->
            <button id="va-right-toggle" onclick="window.vaToggleRight()" class="meta-tooltip tooltip-below tooltip-right-anchored desktop-only-toggle" data-tooltip="Toggle details panel"
                style="background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; transition: background 0.15s; border-radius: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--control-bar-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
            </button>
            <button class="mobile-only mobile-drawer-trigger" data-drawer-target="#viewer-details-panel">Details</button>
        </div>
    </div>

    <!-- Tagging Modal -->
    <div id="tagging-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--color-bg-overlay); z-index: 2000; justify-content: center; align-items: center;">
        <div
            style="background: var(--color-bg-surface); padding: 20px; border: 1px solid var(--color-border); width: 600px; border-radius: 5px; box-shadow: var(--shadow-lg);">
            <h3 id="tagging-modal-title" style="margin-top: 0; color: var(--color-text-primary);">Tags and Notes</h3>

            <div style="margin-bottom: 15px;">
                <div class="text-sm" style="color: var(--color-text-tertiary); margin-bottom: 5px;">Open Tags</div>
                <input type="text" id="tagging-input"
                    placeholder="Add a tag and press Enter (and multiple separated by semi-colon)"
                    style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <div class="text-sm" style="color: var(--color-text-tertiary); margin-bottom: 5px;">Select among the open tags you've
                    already used:</div>
                <div id="tagging-quick-select" style="display: flex; flex-wrap: wrap; gap: 5px; overflow-y: auto;">
                </div>
            </div>

            <div id="tagging-closed-tagging-container" style="display: none; margin-bottom: 15px;">
                <div class="text-sm" style="color: var(--color-text-tertiary); margin-bottom: 5px;">Closed Tags</div>
                <select id="tagging-closed-tagging" class="dropdown"
                    style="width: 100%; padding: 8px;">
                    <option value="" disabled selected></option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <div class="text-sm" style="color: var(--color-text-tertiary); margin-bottom: 5px;">Notes</div>
                <textarea id="tagging-notes" placeholder="Add optional notes..."
                    style="width: 100%; height: 100px; padding: 8px; resize: vertical; min-height: auto;"></textarea>
            </div>

            <div
                style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--color-border); padding-top: 10px;">
                <button class="btn-secondary" onclick="closeTaggingModal()">Cancel</button>
                <button class="btn-primary" onclick="saveTaggingModal()">Save</button>
            </div>
        </div>
    </div>

    <div class="container" style="display: flex; flex-direction: row; height: calc(100vh - 180px); gap: 20px;">

        <!-- Filters Panel (Left) -->
        <div id="va-left-panel" class="panel" data-mobile-drawer="left" style="flex: 0 0 300px; display: flex; flex-direction: column; overflow: hidden;">
            <div class="header" style="flex: 0 0 auto;">
                <h2>Filters</h2>
                <button class="btn-save" onclick="resetViewerFilters()">Reset</button>
            </div>
            <div style="padding: 10px; border-bottom: 1px solid var(--color-border); flex: 0 0 auto;">
                <input type="text" id="viewer-search-input" placeholder="Search... (comma separated)"
                    style="width: 100%; padding: 8px; border-radius: 4px;">
            </div>
            <div id="viewer-filters" style="flex: 1; overflow-y: auto; padding-right: 5px;">
            </div>
            <div class="footer" style="padding: 10px; border-top: 1px solid var(--color-border-subtle); text-align: center;">
                <button id="viewer-apply-filters-btn" class="btn-save" onclick="applyViewerFilters()" style="width:100%">Filters Applied</button>
            </div>
        </div>

        <!-- Main Viewer Panel (Right) -->
        <div class="panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0;">

            <!-- Navigation Header -->
            <div
                style="padding: 15px; border-bottom: 1px solid var(--color-border-subtle); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; background: var(--color-bg-elevated);">

                <!-- Slider Area -->
                <div style="flex: 1 1 200px; display: flex; align-items: center; justify-content: center; padding: 0 20px; min-width: 150px;">
                    <div id="viewer-slider-wrap" style="position: relative; width: 100%;">
                        <div id="viewer-slider-markers" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1;"></div>
                        <input type="range" id="viewer-slider" min="1" max="1" value="1" disabled
                            style="width: 100%; cursor: pointer; position: relative; z-index: 2;">
                    </div>
                </div>

                <div class="nav-controls" style="flex: 0 1 auto; display: flex; gap: 8px; align-items: center; justify-content: center;">
                    <button class="btn-discreet meta-tooltip tooltip-below" onclick="prevExtraData()" id="viewer-skip-prev" disabled
                        data-tooltip="Previous activity with engagement data">&lt;&lt;</button>
                    <button class="btn-secondary meta-tooltip tooltip-below" onclick="prevVideo()"
                        data-tooltip="Previous activity">&lt;</button>
                    <div style="display: flex; flex-direction: column; align-items: center; min-width: 70px; line-height: 1.2;">
                        <span id="viewer-index" class="font-mono text-sm" style="text-align: center;">0 / 0</span>
                        <span id="viewer-status" class="text-xs" style="color: var(--color-text-muted);">No data</span>
                    </div>
                    <button class="btn-secondary meta-tooltip tooltip-below" onclick="nextVideo()"
                        data-tooltip="Next activity">&gt;</button>
                    <button class="btn-discreet meta-tooltip tooltip-below" onclick="nextExtraData()" id="viewer-skip-next" disabled
                        data-tooltip="Next activity with engagement data">&gt;&gt;</button>
                </div>
            </div>

            <!-- Content Area: Video + Metadata -->
            <div style="display: flex; flex: 1; overflow: hidden;">

                <!-- Video Player -->
                <div
                    style="flex: 1; background: var(--color-bg-inset); display: flex; align-items: center; justify-content: center; position: relative;">
                    <video id="viewer-video" controls preload="metadata"
                        style="max-width: 100%; max-height: 100%; width: auto; height: auto;">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <!-- Hidden element for preloading the next video -->
                    <video id="viewer-video-preload" preload="metadata" style="display:none;"></video>
                    <div id="viewer-video-msg" style="position: absolute; color: var(--color-text-muted);">No video selected</div>
                </div>

                <!-- Metadata Sidebar -->
                <div id="viewer-details-panel" data-mobile-drawer="right" style="flex: 0 0 38%; min-width: 280px; max-width: 550px; background: var(--color-bg-surface); border-left: 1px solid var(--color-border-subtle); overflow-y: auto;">
                    <div class="font-bold" style="padding: 10px; background: var(--color-bg-elevated); position: sticky; top: 0;">Details
                        <span id="viewer-vote-container" style="float: right;"></span>
                    </div>
                    <table id="viewer-metadata" class="text-sm" style="width: 100%; border-collapse: collapse;">
                        <tbody>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</div>

<div id="video_viewer" class="tab-pane">

    <!-- Control Bar: Study Selector (Shared logic or separate?) -->
    <!-- We can reuse the same study selector logic if we give it a unique ID or class -->
    <div class="control-bar"
        style="display: flex; align-items: center; padding: 10px; background-color: #252526; margin-bottom: 20px; border-bottom: 1px solid #3e3e42;">
        <div class="header-with-help" style="margin-right: 20px;">
            <h3 style="margin: 0; color: #eee; font-size: 1.1em;">Video Analysis</h3>
            <button class="help-icon" onclick="showHelp('video_viewer')">?</button>
        </div>
        <label for="viewer-study-select" style="margin-right: 10px; font-weight: bold; color: #eee;">Select
            Study:</label>
        <select id="viewer-study-select" class="dropdown" onchange="changeViewerStudy()"
            style="width: 300px; padding: 5px; background: #3c3c3c; border: 1px solid #555; color: white;">
            <option value="" disabled selected>Select a study...</option>
        </select>

        <label for="viewer-sort-select"
            style="margin-right: 10px; margin-left: 20px; font-weight: bold; color: #eee;">Sort By:</label>
        <div style="display: flex; align-items: center;">
            <select id="viewer-sort-select" class="dropdown"
                style="width: 200px; padding: 5px; background: #3c3c3c; border: 1px solid #555; color: white;">
                <option value="" selected>Default (Unsorted)</option>
            </select>
            <button id="viewer-sort-btn" onclick="toggleViewerSort()"
                style="margin-left: 5px; padding: 5px 10px; background: #3c3c3c; border: 1px solid #555; color: white; cursor: pointer;"
                title="Toggle Sort Order">
                ASC
            </button>
        </div>

        <span id="viewer-file-info" style="margin-left: 20px; color: #888; font-size: 0.9em;"></span>

        <!-- Hide Duplicates Filter -->
        <div style="margin-left: auto; display: flex; align-items: center;">
            <label class="switch" style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="viewer-hide-duplicates" onchange="applyViewerFilters()">
                <span style="color: #eee; font-weight: bold; margin-left: 5px;">Hide Duplicate Videos</span>
            </label>
        </div>
    </div>

    <!-- Tagging Modal -->
    <div id="tagging-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
        <div
            style="background: #252526; padding: 20px; border: 1px solid #3e3e42; width: 600px; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <h3 id="tagging-modal-title" style="margin-top: 0; color: #fff;">Tags and Notes</h3>

            <div style="margin-bottom: 15px;">
                <div style="font-size: 0.9em; color: #aaa; margin-bottom: 5px;">Open Tags</div>
                <input type="text" id="tagging-input"
                    placeholder="Add a tag and press Enter (and multiple separated by semi-colon)"
                    style="width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555; color: white;">
            </div>

            <div style="margin-bottom: 15px;">
                <div style="font-size: 0.9em; color: #aaa; margin-bottom: 5px;">Select among the open tags you've
                    already used:</div>
                <div id="tagging-quick-select" style="display: flex; flex-wrap: wrap; gap: 5px; overflow-y: auto;">
                    <!-- Chips injected here -->
                </div>
            </div>

            <div id="tagging-closed-tagging-container" style="display: none; margin-bottom: 15px;">
                <div style="font-size: 0.9em; color: #aaa; margin-bottom: 5px;">Closed Tags</div>
                <select id="tagging-closed-tagging"
                    style="width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555; color: white;">
                    <option value="" disabled selected></option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <div style="font-size: 0.9em; color: #aaa; margin-bottom: 5px;">Notes</div>
                <textarea id="tagging-notes" placeholder="Add optional notes..."
                    style="width: 100%; height: 100px; padding: 8px; background: #3c3c3c; border: 1px solid #555; color: white; resize: vertical; font-family: inherit;"></textarea>
            </div>

            <div
                style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #3e3e42; padding-top: 10px;">
                <button class="btn-secondary" onclick="closeTaggingModal()">Cancel</button>
                <button class="btn-primary" onclick="saveTaggingModal()">Save</button>
            </div>
        </div>
    </div>

    <div class="container" style="display: flex; flex-direction: row; height: calc(100vh - 180px); gap: 20px;">

        <!-- Filters Panel (Left) - Reusing similar layout logic -->
        <div class="panel" style="flex: 0 0 300px; display: flex; flex-direction: column; overflow: hidden;">
            <div class="header" style="flex: 0 0 auto;">
                <h2>Filters</h2>
                <button class="btn-save" onclick="resetViewerFilters()">Reset Filters</button>
            </div>
            <div style="padding: 10px; border-bottom: 1px solid #3e3e42; flex: 0 0 auto;">
                <input type="text" id="viewer-search-input" placeholder="Search... (comma separated)"
                    style="width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555; color: white; border-radius: 4px;">
            </div>
            <div id="viewer-filters" style="flex: 1; overflow-y: auto; padding-right: 5px;">
                <!-- Filter widgets injected here via JS -->
            </div>
            <div class="footer" style="padding: 10px; border-top: 1px solid #333; text-align: center;">
                <button class="btn-primary" onclick="applyViewerFilters()" style="width:100%">Apply Filters</button>
            </div>
        </div>

        <!-- Main Viewer Panel (Right) -->
        <div class="panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0;">

            <!-- Navigation Header -->
            <div
                style="padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #2d2d30;">
                <div style="flex: 0 0 auto;">
                    <h2 style="margin: 0; font-size: 1.2em;">Video Analysis</h2>
                    <span id="viewer-status" style="font-size: 0.9em; color: #888;">No data</span>
                </div>

                <!-- Slider Area -->
                <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 20px;">
                    <input type="range" id="viewer-slider" min="1" max="1" value="1" disabled
                        style="width: 100%; cursor: pointer;">
                </div>

                <div class="nav-controls" style="flex: 0 0 auto; display: flex; gap: 10px; align-items: center;">
                    <button class="btn-secondary" onclick="prevVideo()">&lt; Prev</button>
                    <span id="viewer-index"
                        style="font-family: monospace; font-size: 1.1em; padding: 0 10px; min-width: 80px; text-align: center;">0
                        / 0</span>
                    <button class="btn-secondary" onclick="nextVideo()">Next &gt;</button>
                </div>
            </div>

            <!-- Content Area: Video + Metadata -->
            <div style="display: flex; flex: 1; overflow: hidden;">

                <!-- Video Player -->
                <div
                    style="flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative;">
                    <video id="viewer-video" controls
                        style="max-width: 100%; max-height: 100%; width: auto; height: auto;">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div id="viewer-video-msg" style="position: absolute; color: #888;">No video selected</div>
                </div>

                <!-- Metadata Sidebar -->
                <div style="flex: 0 0 500px; background: #252526; border-left: 1px solid #333; overflow-y: auto;">
                    <div style="padding: 10px; font-weight: bold; background: #333; position: sticky; top: 0;">Metadata
                        (Click to Tag)
                        <span id="viewer-vote-container" style="float: right;"></span>
                    </div>
                    <table id="viewer-metadata" style="width: 100%; border-collapse: collapse; font-size: 0.85em;">
                        <tbody>
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</div>

<style>
    #viewer-metadata td {
        padding: 5px 10px;
        border-bottom: 1px solid #333;
        color: #ddd;
        vertical-align: top;
    }

    #viewer-metadata td:first-child {
        font-weight: bold;
        color: #aaa;
        min-width: 180px;
        /* Enforce minimum width */
        word-break: break-word;
        /* Prevent aggressive breaking */
    }

    #viewer-metadata td:last-child {
        min-width: 200px;
        /* Give value column space too */
        word-break: break-word;
    }

    #viewer-metadata tr:hover {
        background: #2a2a2d;
    }

    /* Custom Tooltip CSS */
    .meta-tooltip {
        position: relative;
        cursor: help;
        text-decoration: underline dotted #888;
    }

    .meta-tooltip::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 100%;
        left: 0;
        /* transform: translateX(-50%); Removed to prevent left overflow */
        background: #333;
        color: #fff;
        padding: 8px;
        /* Increased padding */
        border-radius: 4px;
        font-size: 0.85em;
        white-space: pre-wrap;
        /* Allow line breaks */
        max-width: 300px;
        /* Constrain width */
        width: max-content;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        border: 1px solid #555;
    }

    .meta-tooltip:hover::after {
        opacity: 1;
        bottom: 110%;
        /* Move up slightly on hover */
    }
</style>
